<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cosmos - 천체관측 동아리</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg-deep:#080a1a;
  --bg-navy:#0d1442;
  --bg-navy2:#131b52;
  --card-bg:rgba(255,255,255,0.045);
  --card-border:rgba(232,195,104,0.22);
  --gold:#e8c368;
  --gold-soft:#f2dca0;
  --text:#f2f0e6;
  --text-dim:#a9b0d0;
  --danger:#e26b6b;
  --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:radial-gradient(ellipse at 20% -10%, var(--bg-navy2), var(--bg-deep) 60%);
  color:var(--text);
  font-family:'Noto Sans KR',sans-serif;
  min-height:100vh;
  position:relative;
  overflow-x:hidden;
}
h1,h2,h3,.brand-name{font-family:'Playfair Display',Georgia,serif;}
a{color:inherit;text-decoration:none;}
.hidden{display:none !important;}

#starLayer{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.star{position:absolute;background:#fff;border-radius:50%;opacity:0.6;animation:twinkle 3s ease-in-out infinite;}
@keyframes twinkle{0%,100%{opacity:0.15;}50%{opacity:0.9;}}

.inapp-banner{
  position:relative;z-index:50;background:var(--gold);color:#181022;
  padding:10px 16px;font-size:13px;text-align:center;
  display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;
}
.inapp-banner button{
  background:#181022;color:var(--gold-soft);border:none;border-radius:8px;
  padding:6px 12px;font-weight:700;cursor:pointer;font-size:12px;
}

header{
  position:relative;z-index:10;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 28px;flex-wrap:wrap;gap:12px;
  border-bottom:1px solid var(--card-border);
  background:rgba(8,10,26,0.55);
  backdrop-filter:blur(6px);
  position:sticky;top:0;
}
.brand{display:flex;align-items:center;gap:10px;}
.brand img{height:40px;width:40px;object-fit:contain;border-radius:8px;}
.brand-name{font-size:22px;font-weight:700;color:var(--gold-soft);letter-spacing:1px;}
.nav{display:flex;gap:24px;flex-wrap:wrap;}
.nav-link{font-size:15px;color:var(--text-dim);padding:6px 2px;border-bottom:2px solid transparent;transition:.2s;}
.nav-link:hover,.nav-link.active{color:var(--gold-soft);border-bottom-color:var(--gold);}
.auth-box{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}

.btn{
  border:none;border-radius:9px;padding:9px 16px;font-size:14px;font-weight:600;
  cursor:pointer;font-family:inherit;transition:.15s;
}
.btn-sm{padding:6px 11px;font-size:12.5px;}
.btn-gold{background:linear-gradient(135deg,var(--gold-soft),var(--gold));color:#181022;}
.btn-gold:hover{filter:brightness(1.08);}
.btn-ghost{background:transparent;color:var(--text-dim);border:1px solid var(--card-border);}
.btn-ghost:hover{color:var(--text);border-color:var(--gold);}
.btn-outline-gold{background:transparent;color:var(--gold-soft);border:1px solid var(--gold);}
.btn-outline-gold:hover{background:rgba(232,195,104,0.1);}
.btn-danger{background:transparent;color:var(--danger);border:1px solid rgba(226,107,107,0.5);}
.btn-danger:hover{background:rgba(226,107,107,0.12);}
.btn:disabled{opacity:.5;cursor:not-allowed;}

.user-badge{font-size:14px;color:var(--gold-soft);}
.admin-badge{
  background:rgba(232,195,104,0.15);color:var(--gold-soft);
  padding:5px 12px;border-radius:20px;font-size:12.5px;font-weight:700;
  border:1px solid var(--gold);
}
.badge-count{
  background:var(--danger);color:#fff;border-radius:10px;font-size:10.5px;
  padding:1px 6px;margin-left:5px;
}

main,#app{position:relative;z-index:5;max-width:1180px;margin:0 auto;padding:32px 24px 80px;}
.page-title{font-size:28px;color:var(--gold-soft);margin:0 0 18px;}

.hero{text-align:center;padding:50px 10px 40px;}
.hero-logo{height:110px;width:110px;object-fit:contain;margin-bottom:14px;filter:drop-shadow(0 0 20px rgba(232,195,104,0.35));}
.hero-title{font-size:44px;color:var(--gold-soft);margin:0;letter-spacing:3px;}
.hero-tagline{color:var(--text-dim);margin:10px 0 34px;font-size:15px;}
.hero-nav{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;}
.hero-nav-card{
  background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius);
  padding:26px 34px;display:flex;flex-direction:column;align-items:center;gap:10px;
  min-width:150px;transition:.2s;
}
.hero-nav-card:hover{border-color:var(--gold);transform:translateY(-3px);}
.hero-nav-icon{font-size:30px;}
.home-section{margin-top:56px;}
.home-section-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px;}
.home-section-head h2{font-size:20px;color:var(--gold-soft);margin:0;}
.home-section-head a{font-size:13px;color:var(--text-dim);}
.gallery-grid-preview{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));}
.post-list-preview{display:flex;flex-direction:column;gap:10px;}
.post-preview-item{
  display:block;background:var(--card-bg);border:1px solid var(--card-border);
  border-radius:10px;padding:14px 18px;transition:.15s;
}
.post-preview-item:hover{border-color:var(--gold);}
.post-preview-title{font-weight:700;color:var(--text);}
.post-preview-meta{font-size:12.5px;color:var(--text-dim);margin-top:4px;}

.gallery-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;margin-bottom:20px;}
.gallery-toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
.search-input{
  background:rgba(255,255,255,0.05);border:1px solid var(--card-border);border-radius:20px;
  padding:10px 18px;color:var(--text);font-size:14px;min-width:260px;
}
.search-input::placeholder{color:var(--text-dim);}
.search-input:focus,.text-input:focus,.select-input:focus,textarea:focus{outline:1px solid var(--gold);}

.gallery-layout{display:grid;grid-template-columns:200px 1fr;gap:28px;align-items:start;}
.gallery-sidebar{
  background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius);
  padding:18px;display:flex;flex-direction:column;gap:20px;position:sticky;top:90px;
}
.filter-label{font-size:12.5px;color:var(--gold-soft);font-weight:700;margin-bottom:8px;letter-spacing:.5px;}
.filter-radios{display:flex;flex-direction:column;gap:7px;}
.radio-item{display:flex;align-items:center;gap:7px;font-size:13.5px;color:var(--text-dim);cursor:pointer;}
.radio-item input{accent-color:var(--gold);}
.select-input{
  width:100%;background:rgba(255,255,255,0.05);border:1px solid var(--card-border);
  border-radius:8px;padding:8px 10px;color:var(--text);font-size:13.5px;
}

.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px;}
.photo-card{
  display:block;background:var(--card-bg);border:1px solid var(--card-border);
  border-radius:var(--radius);overflow:hidden;transition:.2s;
}
.photo-card:hover{transform:translateY(-4px);border-color:var(--gold);box-shadow:0 8px 26px rgba(232,195,104,0.15);}
.photo-card-img{
  aspect-ratio:4/3;background-size:cover;background-position:center;background-color:#0a1030;
}
.photo-card-body{padding:12px 14px;}
.photo-card-title{font-weight:700;font-size:15px;margin-bottom:4px;}
.photo-card-meta{font-size:12px;color:var(--text-dim);}

.empty-state,.loading-state,.error-state{
  grid-column:1/-1;text-align:center;padding:50px 20px;color:var(--text-dim);
}
.error-state{color:var(--danger);}

.photo-detail{display:grid;grid-template-columns:1.4fr 1fr;gap:34px;}
.photo-detail-img img{width:100%;border-radius:var(--radius);border:1px solid var(--card-border);}
.tag{
  display:inline-block;background:rgba(232,195,104,0.15);color:var(--gold-soft);
  padding:4px 12px;border-radius:16px;font-size:12px;margin-bottom:14px;
}
.meta-list{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:16px 0;font-size:13.5px;}
.meta-list dt{color:var(--text-dim);}
.meta-list dd{margin:0;}
.photo-desc{line-height:1.7;color:var(--text);white-space:pre-wrap;}
.post-actions{display:flex;gap:10px;margin-top:20px;}
.back-link{display:inline-block;margin-top:24px;color:var(--text-dim);font-size:13.5px;}
.back-link:hover{color:var(--gold-soft);}

.logs-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.post-list{display:flex;flex-direction:column;gap:12px;}
.post-list-item{
  display:block;background:var(--card-bg);border:1px solid var(--card-border);
  border-radius:12px;padding:18px 22px;transition:.15s;
}
.post-list-item:hover{border-color:var(--gold);}
.post-list-title{font-weight:700;font-size:16px;}
.post-list-meta{font-size:12.5px;color:var(--text-dim);margin-top:6px;}

.post-detail .post-meta{color:var(--text-dim);font-size:13px;margin-bottom:20px;}
.post-body{line-height:1.8;font-size:15.5px;}
.post-body img{max-width:100%;border-radius:10px;margin:14px 0;}
.post-body h3{color:var(--gold-soft);margin-top:24px;}
.post-body hr{border:none;border-top:1px solid var(--card-border);margin:24px 0;}

.title-input{width:100%;font-size:22px;font-weight:700;margin-bottom:14px;padding:12px 16px;}
.text-input{
  background:rgba(255,255,255,0.05);border:1px solid var(--card-border);border-radius:9px;
  color:var(--text);font-family:inherit;
}
.editor-wrap{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius);overflow:hidden;}
.editor-toolbar{display:flex;gap:6px;padding:10px;border-bottom:1px solid var(--card-border);flex-wrap:wrap;}
.editor-toolbar button{
  background:rgba(255,255,255,0.06);border:1px solid var(--card-border);color:var(--text-dim);
  border-radius:6px;padding:6px 11px;cursor:pointer;font-size:13px;font-family:inherit;
}
.editor-toolbar button:hover{color:var(--gold-soft);border-color:var(--gold);}
.editor-body{min-height:340px;padding:20px;line-height:1.8;font-size:15px;}
.editor-body:focus{outline:none;}
.editor-actions{display:flex;gap:10px;margin-top:18px;}
.admin-toolbar{margin-bottom:14px;}
.about-content{line-height:1.85;font-size:15.5px;}
.about-content img{max-width:100%;border-radius:10px;margin:14px 0;}

.modal-overlay{
  position:fixed;inset:0;background:rgba(4,5,16,0.72);
  display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;
}
.modal-box{
  background:var(--bg-navy);border:1px solid var(--card-border);border-radius:var(--radius);
  padding:30px;width:100%;max-width:420px;position:relative;
  box-shadow:0 20px 60px rgba(0,0,0,0.5);max-height:88vh;overflow-y:auto;
}
.modal-box-wide{max-width:600px;}
.modal-box h2{margin:0 0 20px;color:var(--gold-soft);font-size:20px;}
.modal-close{
  position:absolute;top:14px;right:16px;background:none;border:none;color:var(--text-dim);
  font-size:22px;cursor:pointer;line-height:1;
}
.modal-close:hover{color:var(--gold);}
.modal-box form label{display:block;font-size:13px;color:var(--text-dim);margin-bottom:14px;}
.modal-box form input,.modal-box form select,.modal-box form textarea{
  display:block;width:100%;margin-top:6px;background:rgba(255,255,255,0.05);
  border:1px solid var(--card-border);border-radius:8px;padding:9px 12px;
  color:var(--text);font-family:inherit;font-size:14px;
}
.modal-actions{margin-top:8px;display:flex;gap:10px;}
.modal-hint{font-size:12.5px;color:var(--text-dim);margin-top:14px;}
.modal-hint a{color:var(--gold-soft);}

.pending-list{display:flex;flex-direction:column;gap:10px;max-height:60vh;overflow-y:auto;}
.pending-item{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  background:rgba(255,255,255,0.04);border:1px solid var(--card-border);
  border-radius:10px;padding:12px 14px;flex-wrap:wrap;
}
.pending-date{color:var(--text-dim);font-size:11.5px;margin-left:6px;}
.pending-actions{display:flex;gap:8px;}

#toast{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%);
  background:var(--gold);color:#181022;padding:12px 22px;border-radius:10px;
  font-size:13.5px;font-weight:600;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,0.4);
}
#toast.toast-error{background:var(--danger);color:#fff;}

footer{position:relative;z-index:5;text-align:center;padding:26px;color:var(--text-dim);font-size:12px;border-top:1px solid var(--card-border);}

@media (max-width:820px){
  .gallery-layout{grid-template-columns:1fr;}
  .gallery-sidebar{position:static;flex-direction:row;flex-wrap:wrap;}
  .photo-detail{grid-template-columns:1fr;}
  header{padding:12px 16px;}
  main,#app{padding:24px 16px 60px;}
}
</style>
</head>
<body>

<div id="starLayer"></div>

<div id="inappBanner" class="inapp-banner hidden">
  인앱 브라우저에서는 일부 기능이 제대로 동작하지 않을 수 있습니다.
  <button id="inappOpenBtn" type="button">외부 브라우저로 열기</button>
</div>

<header>
  <a href="#/" class="brand">
    <img src="logo.png" alt="Cosmos 로고">
    <span class="brand-name">Cosmos</span>
  </a>
  <nav class="nav">

</div>

      <label>카테고리

          <option>딥스카이</option><option>태양계</option><option>성운</option><option>행성</option><option>기타</option>

      <label>장비<input type="text" id="photoEquipment"></label>

<script>
const APPS_SCRIPT_URL = 'PASTE_YOUR_DEPLOYED_WEB_APP_URL_HERE';

// ===== 유틸 =====
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function norm(s){
  return String(s==null?'':s).replace(/[\s　​]/g,'').normalize('NFC');
}
function debounce(fn, ms){
  let t;
  return (...args)=>{ clearTimeout(t); t=setTimeout(()=>fn(...args), ms); };
}
function sanitizeHtml(html){
  const doc = new DOMParser().parseFromString(html || '', 'text/html');
  const allowed = new Set(['P','BR','B','STRONG','I','EM','U','H1','H2','H3','H4','UL','OL','LI','IMG','A','HR','DIV','SPAN','BLOCKQUOTE']);
  const walk = (node)=>{
    [...node.childNodes].forEach(child=>{
      if(child.nodeType===1){
        if(!allowed.has(child.tagName)){
          child.replaceWith(...child.childNodes);
          return;
        }
        [...child.attributes].forEach(attr=>{
          const name = attr.name.toLowerCase();
          const ok = (child.tagName==='IMG' && (name==='src'||name==='alt')) ||
                     (child.tagName==='A' && (name==='href'||name==='target'));
          if(!ok) child.removeAttribute(attr.name);
        });
        walk(child);
      } else if(child.nodeType===8){
        child.remove();
      }
    });
  };
  walk(doc.body);
  return doc.body.innerHTML;
}
function resizeImage(file, maxDim, quality){
  maxDim = maxDim || 1600; quality = quality || 0.85;
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let {width, height} = img;
        if(width>maxDim || height>maxDim){
          if(width>height){ height=Math.round(height*maxDim/width); width=maxDim; }
          else { width=Math.round(width*maxDim/height); height=maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width=width; canvas.height=height;
        canvas.getContext('2d').drawImage(img,0,0,width,height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ===== API (fetch POST, 커스텀 헤더 없이 simple request로 유지 → CORS preflight 회피) =====
function fetchWithTimeout(url, opts, ms){
  const controller = new AbortController();
  const t = setTimeout(()=>controller.abort(), ms);
  return fetch(url, Object.assign({}, opts, {signal:controller.signal})).finally(()=>clearTimeout(t));
}
async function callApiOnce(action, params){
  const body = new URLSearchParams(Object.assign({action}, params||{}));
  const res = await fetchWithTimeout(APPS_SCRIPT_URL, {method:'POST', body}, 15000);
  return res.json();
}
async function callApi(action, params){
  let data;
  try{
    data = await callApiOnce(action, params);
  }catch(networkErr){
    await new Promise(r=>setTimeout(r,1200));
    data = await callApiOnce(action, params);
  }
  if(data && data.error) throw new Error(data.error);
  return data;
}

// ===== 인증 상태 =====
function getUser(){
  try{ return JSON.parse(localStorage.getItem('cosmos_user')||'null'); }catch(e){ return null; }
}
function setUser(u){ localStorage.setItem('cosmos_user', JSON.stringify(u)); }
function clearUser(){ localStorage.removeItem('cosmos_user'); }
function isAdminMode(){ return !!sessionStorage.getItem('cosmos_admin_pw'); }
function setAdminPw(pw){ sessionStorage.setItem('cosmos_admin_pw', pw); }
function clearAdmin(){ sessionStorage.removeItem('cosmos_admin_pw'); }
function getAuthParams(){
  if(isAdminMode()) return {adminPw: sessionStorage.getItem('cosmos_admin_pw')};
  const u = getUser();
  if(u) return {name:u.name, pw:u.pw};
  return {};
}

// ===== 토스트 =====
function showToast(msg, isError){
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.toggle('toast-error', !!isError);
  toast.classList.remove('hidden');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>toast.classList.add('hidden'), 3000);
}
function hideToast(){ document.getElementById('toast').classList.add('hidden'); }

// ===== 모달 =====
function openModal(id){ document.getElementById(id).classList.remove('hidden'); }
function closeModal(id){ document.getElementById(id).classList.add('hidden'); }
function closeAllModals(){ document.querySelectorAll('.modal-overlay').forEach(m=>m.classList.add('hidden')); }

// ===== 공통 페이지 조각 =====
function pageShell(cls, inner){ return `<div class="page ${cls}">${inner}</div>`; }
function loadingHtml(){ return '<div class="loading-state">불러오는 중...</div>'; }
function errorHtml(msg){ return `<div class="error-state">오류: ${esc(msg)}</div>`; }
function requireLoginHtml(msg){
  return `<div class="empty-state">${esc(msg)}<br><br><button type="button" class="btn btn-gold" id="requireLoginBtn">로그인</button></div>`;
}
function bindRequireLoginEvents(app){
  const btn = app.querySelector('#requireLoginBtn');
  if(btn) btn.addEventListener('click', ()=>openModal('loginModal'));
}

// ===== 리치 에디터 (탐구일지 / 소개 공용) =====
function mountEditor(initialHtml){
  const wrap = document.createElement('div');
  wrap.className = 'editor-wrap';
  wrap.innerHTML = `
    <div class="editor-toolbar">
      <button type="button" data-cmd="bold"><b>B</b></button>
      <button type="button" data-cmd="italic"><i>I</i></button>
      <button type="button" data-cmd="formatBlock" data-value="h3">제목</button>
      <button type="button" data-cmd="formatBlock" data-value="p">본문</button>
      <button type="button" data-cmd="insertUnorderedList">목록</button>
      <button type="button" data-cmd="insertHorizontalRule">구분선</button>
      <button type="button" class="editor-img-btn">사진 삽입</button>
      <input type="file" accept="image/*" class="hidden editor-img-input">
    </div>
    <div class="editor-body" contenteditable="true">${initialHtml||''}</div>
  `;
  wrap.querySelectorAll('[data-cmd]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.execCommand(btn.dataset.cmd, false, btn.dataset.value||null);
      wrap.querySelector('.editor-body').focus();
    });
  });
  const imgInput = wrap.querySelector('.editor-img-input');
  wrap.querySelector('.editor-img-btn').addEventListener('click', ()=>imgInput.click());
  imgInput.addEventListener('change', async ()=>{
    const file = imgInput.files[0];
    if(!file) return;
    wrap.querySelector('.editor-body').focus();
    try{
      showToast('이미지 업로드 중...');
      const dataUrl = await resizeImage(file, 1600, 0.85);
      const res = await callApi('uploadImage', Object.assign({imageData:dataUrl, fileName:file.name}, getAuthParams()));
      document.execCommand('insertImage', false, res.url);
      hideToast();
    }catch(err){ showToast('이미지 업로드 실패: '+err.message, true); }
    imgInput.value = '';
  });
  wrap.getContent = ()=>sanitizeHtml(wrap.querySelector('.editor-body').innerHTML);
  return wrap;
}

// ===== 라우터 =====
function parseHash(){
  const raw = location.hash.slice(1);
  const [pathPart, queryPart] = raw.split('?');
  const segments = pathPart.split('/').filter(Boolean);
  return {segments, query:new URLSearchParams(queryPart||'')};
}
function updateNavActive(path){
  document.querySelectorAll('.nav-link').forEach(a=>a.classList.toggle('active', a.dataset.route===path));
}
function router(){
  const {segments} = parseHash();
  const path = segments[0] || '';
  const app = document.getElementById('app');
  updateNavActive(path);
  closeAllModals();
  if(path==='') renderHome(app);
  else if(path==='about') renderAbout(app);
  else if(path==='gallery') renderGallery(app);
  else if(path==='photo') renderPhotoDetail(app, segments[1]);
  else if(path==='logs') renderLogs(app);
  else if(path==='post') renderPostDetail(app, segments[1]);
  else if(path==='write') renderWrite(app, segments[1]);
  else renderHome(app);
  window.scrollTo(0,0);
}

async function renderAbout(app){
  app.innerHTML = pageShell('about-page', loadingHtml());
  let intro;
  try{ intro = await callApi('getIntro', {}); }
  catch(err){ app.innerHTML = pageShell('about-page', errorHtml(err.message)); return; }
  app.innerHTML = pageShell('about-page', `
    <h1 class="page-title">동아리 소개</h1>
    ${isAdminMode() ? '<div class="admin-toolbar"><button type="button" class="btn btn-ghost" id="editAboutBtn">수정</button></div>' : ''}
    <div id="aboutContent" class="about-content">${sanitizeHtml(intro.content)}</div>
  `);
  const editBtn = document.getElementById('editAboutBtn');
  if(editBtn) editBtn.addEventListener('click', ()=>enterAboutEditMode(intro.content));
}
function enterAboutEditMode(content){
  const container = document.getElementById('aboutContent');
  const toolbar = document.querySelector('.admin-toolbar');
  if(toolbar) toolbar.style.display = 'none';
  container.innerHTML = '';
  const editor = mountEditor(content);
  container.appendChild(editor);
  const actions = document.createElement('div');
  actions.className = 'editor-actions';
  actions.innerHTML = `<button type="button" class="btn btn-gold" id="saveAboutBtn">저장</button><button type="button" class="btn btn-ghost" id="cancelAboutBtn">취소</button>`;
  container.appendChild(actions);
  document.getElementById('saveAboutBtn').addEventListener('click', async ()=>{
    try{
      await callApi('saveIntro', Object.assign({content:editor.getContent()}, getAuthParams()));
      showToast('저장되었습니다.');
      renderAbout(document.getElementById('app'));
    }catch(err){ showToast('저장 실패: '+err.message, true); }
  });
  document.getElementById('cancelAboutBtn').addEventListener('click', ()=>renderAbout(document.getElementById('app')));
}

// ===== 갤러리 =====
const CATEGORIES = ['전체','딥스카이','태양계','성운','행성','기타'];
let galleryCache = null;
let galleryFilters = {q:'', category:'전체', location:'전체', equipment:'전체', sort:'latest'};

async function renderGallery(app){
  app.innerHTML = pageShell('gallery-page', loadingHtml());
  try{
    const data = await callApi('listGallery', {});
    galleryCache = data.list || [];
  }catch(err){
    app.innerHTML = pageShell('gallery-page', errorHtml('갤러리를 불러오지 못했습니다: '+err.message));
    return;
  }
  app.innerHTML = pageShell('gallery-page', galleryPageHtml());
  bindGalleryEvents();
  applyGalleryFilters();
}
function galleryPageHtml(){
  return `
    <div class="gallery-header">
      <h1 class="page-title">천체사진 갤러리</h1>
      <div class="gallery-toolbar">
        <input type="text" id="gallerySearch" class="search-input" placeholder="천체, 날짜, 관측 장소 검색...">
        ${(getUser()||isAdminMode()) ? '<button type="button" class="btn btn-gold" id="openUploadBtn">새 사진 업로드 +</button>' : ''}
      </div>
    </div>
    <div class="gallery-layout">
      <aside class="gallery-sidebar">
        <div class="filter-group">
          <div class="filter-label">카테고리</div>
          <div id="categoryFilters" class="filter-radios"></div>
        </div>
        <div class="filter-group">
          <div class="filter-label">촬영 장소</div>
          <select id="locationFilter" class="select-input"></select>
        </div>
        <div class="filter-group">
          <div class="filter-label">장비</div>
          <select id="equipmentFilter" class="select-input"></select>
        </div>
        <div class="filter-group">
          <div class="filter-label">정렬</div>
          <select id="sortFilter" class="select-input">
            <option value="latest">최신순</option>
            <option value="popular">인기순</option>
          </select>
        </div>
      </aside>
      <div class="gallery-grid" id="galleryGrid"></div>
    </div>
  `;
}
function bindGalleryEvents(){
  const search = document.getElementById('gallerySearch');
  if(search) search.addEventListener('input', debounce(()=>{ galleryFilters.q=search.value; applyGalleryFilters(); }, 200));
  const sortSel = document.getElementById('sortFilter');
  if(sortSel) sortSel.addEventListener('change', ()=>{ galleryFilters.sort=sortSel.value; applyGalleryFilters(); });
  const uploadBtn = document.getElementById('openUploadBtn');
  if(uploadBtn) uploadBtn.addEventListener('click', ()=>openPhotoModal());
}
function applyGalleryFilters(){
  const catBox = document.getElementById('categoryFilters');
  if(catBox && !catBox.dataset.built){
    catBox.innerHTML = CATEGORIES.map(c=>`
      <label class="radio-item">
        <input type="radio" name="categoryFilter" value="${esc(c)}" ${galleryFilters.category===c?'checked':''}>
        ${esc(c)}
      </label>`).join('');
    catBox.dataset.built = '1';
    catBox.addEventListener('change', (e)=>{ galleryFilters.category=e.target.value; applyGalleryFilters(); });
  }
  const locSel = document.getElementById('locationFilter');
  const eqSel = document.getElementById('equipmentFilter');
  if(locSel && !locSel.dataset.built){
    const locs = ['전체', ...new Set(galleryCache.map(g=>g.location).filter(Boolean))];
    locSel.innerHTML = locs.map(l=>`<option value="${esc(l)}">${esc(l)}</option>`).join('');
    locSel.dataset.built = '1';
    locSel.addEventListener('change', ()=>{ galleryFilters.location=locSel.value; applyGalleryFilters(); });
  }
  if(eqSel && !eqSel.dataset.built){
    const eqs = ['전체', ...new Set(galleryCache.map(g=>g.equipment).filter(Boolean))];
    eqSel.innerHTML = eqs.map(l=>`<option value="${esc(l)}">${esc(l)}</option>`).join('');
    eqSel.dataset.built = '1';
    eqSel.addEventListener('change', ()=>{ galleryFilters.equipment=eqSel.value; applyGalleryFilters(); });
  }

  let list = galleryCache.slice();
  const q = galleryFilters.q.trim().toLowerCase();
  if(q) list = list.filter(g=>[g.title,g.desc,g.location].some(v=>String(v||'').toLowerCase().includes(q)));
  if(galleryFilters.category!=='전체') list = list.filter(g=>g.category===galleryFilters.category);
  if(galleryFilters.location!=='전체') list = list.filter(g=>g.location===galleryFilters.location);
  if(galleryFilters.equipment!=='전체') list = list.filter(g=>g.equipment===galleryFilters.equipment);
  if(galleryFilters.sort==='popular') list.sort((a,b)=>(b.views||0)-(a.views||0));
  else list.sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));

  const grid = document.getElementById('galleryGrid');
  grid.innerHTML = list.length ? list.map(galleryCardHtml).join('') : '<div class="empty-state">조건에 맞는 사진이 없습니다.</div>';
}
function galleryCardHtml(g){
  return `<a href="#/photo/${g.id}" class="photo-card">
    <div class="photo-card-img" style="background-image:url('${g.thumb}')"></div>
    <div class="photo-card-body">
      <div class="photo-card-title">${esc(g.title)}</div>
      <div class="photo-card-meta">${esc(g.author)} · ${esc(g.shotAt||g.createdAt)}</div>
    </div>
  </a>`;
}

async function renderPhotoDetail(app, id){
  app.innerHTML = pageShell('photo-page', loadingHtml());
  let photo;
  try{ photo = await callApi('getPhoto', {id}); }
  catch(err){ app.innerHTML = pageShell('photo-page', errorHtml(err.message)); return; }
  const canEdit = (getUser() && norm(getUser().name)===norm(photo.author)) || isAdminMode();
  app.innerHTML = pageShell('photo-page', `
    <div class="photo-detail">
      <div class="photo-detail-img"><img src="${photo.full}" alt="${esc(photo.title)}"></div>
      <div class="photo-detail-info">
        <h1 class="page-title">${esc(photo.title)}</h1>
        <div><span class="tag">${esc(photo.category)}</span></div>
        <dl class="meta-list">
          <dt>촬영 일시</dt><dd>${esc(photo.shotAt||'-')}</dd>
          <dt>촬영 장소</dt><dd>${esc(photo.location||'-')}</dd>
          <dt>장비</dt><dd>${esc(photo.equipment||'-')}</dd>
          <dt>작성자</dt><dd>${esc(photo.author)}</dd>
          <dt>등록일</dt><dd>${esc(photo.createdAt)}</dd>
          <dt>조회수</dt><dd>${photo.views}</dd>
        </dl>
        <p class="photo-desc">${esc(photo.desc||'')}</p>
        ${canEdit ? `<div class="post-actions">
          <button type="button" class="btn btn-ghost" id="editPhotoBtn">수정</button>
          <button type="button" class="btn btn-danger" id="deletePhotoBtn">삭제</button>
        </div>` : ''}
        <a href="#/gallery" class="back-link">← 갤러리로</a>
      </div>
    </div>
  `);
  if(canEdit){
    document.getElementById('editPhotoBtn').addEventListener('click', ()=>openPhotoModal(photo));
    document.getElementById('deletePhotoBtn').addEventListener('click', async ()=>{
      if(!confirm('정말 삭제하시겠습니까?')) return;
      try{
        await callApi('deletePhoto', Object.assign({id:photo.id}, getAuthParams()));
        location.hash = '#/gallery';
      }catch(err){ showToast('삭제 실패: '+err.message, true); }
    });
  }
}

let editingPhotoId = null;
function openPhotoModal(photo){
  editingPhotoId = photo ? photo.id : null;
  document.getElementById('photoModalTitle').textContent = photo ? '사진 정보 수정' : '새 사진 업로드';
  document.getElementById('photoTitle').value = photo ? photo.title : '';
  document.getElementById('photoCategory').value = photo ? photo.category : '딥스카이';
  document.getElementById('photoShotAt').value = photo ? photo.shotAt : '';
  document.getElementById('photoLocation').value = photo ? photo.location : '';
  document.getElementById('photoEquipment').value = photo ? photo.equipment : '';
  document.getElementById('photoDesc').value = photo ? photo.desc : '';
  document.getElementById('photoFile').required = !photo;
  document.getElementById('photoFileLabel').style.display = photo ? 'none' : '';
  openModal('photoModal');
}

async function renderWrite(app, id){
  if(!getUser() && !isAdminMode()){
    app.innerHTML = pageShell('write-page', requireLoginHtml('글을 작성하려면 로그인이 필요합니다.'));
    bindRequireLoginEvents(app);
    return;
  }
  let post = {title:'', content:'', author:null};
  if(id){
    app.innerHTML = pageShell('write-page', loadingHtml());
    try{ post = await callApi('getPost', {id}); }
    catch(err){ app.innerHTML = pageShell('write-page', errorHtml(err.message)); return; }
    if(getUser() && norm(post.author)!==norm(getUser().name) && !isAdminMode()){
      app.innerHTML = pageShell('write-page', errorHtml('본인 글만 수정할 수 있습니다.'));
      return;
    }
  }
  app.innerHTML = pageShell('write-page', `
    <h1 class="page-title">${id ? '탐구 일지 수정' : '탐구 일지 작성'}</h1>
    <input type="text" id="postTitleInput" class="text-input title-input" placeholder="제목을 입력하세요" value="${esc(post.title)}">
    <div id="editorMount"></div>
    <div class="editor-actions">
      <button type="button" class="btn btn-gold" id="savePostBtn">저장</button>
      <a href="#/logs" class="btn btn-ghost">취소</a>
    </div>
  `);
  const editor = mountEditor(post.content);
  document.getElementById('editorMount').appendChild(editor);
  document.getElementById('savePostBtn').addEventListener('click', async ()=>{
    const title = document.getElementById('postTitleInput').value.trim();
    if(!title){ showToast('제목을 입력해주세요.', true); return; }
    const content = editor.getContent();
    try{
      const params = Object.assign({title, content}, getAuthParams());
      if(id) params.id = id;
      const res = await callApi('savePost', params);
      location.hash = '#/post/'+res.id;
      renderPostDetail(document.getElementById('app'), res.id);
    }catch(err){ showToast('저장 실패: '+err.message, true); }
  });
}

// ===== 헤더 =====
async function refreshHeader(){
  const user = getUser();
  const admin = isAdminMode();
  const authBox = document.getElementById('authBox');
  let html = '';
  if(admin){
    html += `<span class="admin-badge">관리자 모드</span>
             <button type="button" class="btn btn-ghost btn-sm" id="pendingBtn">가입 승인<span id="pendingCount" class="badge-count hidden">0</span></button>
             <button type="button" class="btn btn-ghost btn-sm" id="adminExitBtn">관리자 종료</button>`;
  }
  if(user){
    html += `<span class="user-badge">${esc(user.name)}님</span>
             <button type="button" class="btn btn-ghost btn-sm" id="logoutBtn">로그아웃</button>`;
  } else if(!admin){
    html += `<button type="button" class="btn btn-ghost btn-sm" id="loginBtn">로그인</button>
             <button type="button" class="btn btn-ghost btn-sm" id="signupBtn">회원가입</button>`;
  }
  if(!admin){
    html += `<button type="button" class="btn btn-outline-gold btn-sm" id="adminBtn">관리자 모드</button>`;
  }
  authBox.innerHTML = html;

  const bind = (id, fn)=>{ const el=document.getElementById(id); if(el) el.addEventListener('click', fn); };
  bind('loginBtn', ()=>openModal('loginModal'));
  bind('signupBtn', ()=>openModal('signupModal'));
  bind('adminBtn', ()=>openModal('adminModal'));
  bind('logoutBtn', ()=>{ clearUser(); refreshHeader(); router(); showToast('로그아웃되었습니다.'); });
  bind('adminExitBtn', ()=>{ clearAdmin(); refreshHeader(); router(); showToast('관리자 모드를 종료했습니다.'); });
  bind('pendingBtn', ()=>openPendingModal());

  if(admin){
    try{
      const res = await callApi('listPending', getAuthParams());
      const count = (res.list||[]).length;
      const badge = document.getElementById('pendingCount');
      if(badge){ badge.textContent = count; badge.classList.toggle('hidden', count===0); }
    }catch(e){}
  }
}

async function openPendingModal(){
  openModal('pendingModal');
  const box = document.getElementById('pendingList');
  box.innerHTML = loadingHtml();
  try{
    const res = await callApi('listPending', getAuthParams());
    const list = res.list || [];
    box.innerHTML = list.length ? list.map(m=>`
      <div class="pending-item">
        <div><strong>${esc(m.name)}</strong> · ${esc(m.dept)}<span class="pending-date">${esc(m.date)}</span></div>
        <div class="pending-actions">
          <button type="button" class="btn btn-gold btn-sm" data-approve="${esc(m.name)}">승인</button>
          <button type="button" class="btn btn-danger btn-sm" data-reject="${esc(m.name)}">거절</button>
        </div>
      </div>
    `).join('') : '<div class="empty-state">대기 중인 가입 신청이 없습니다.</div>';
    box.querySelectorAll('[data-approve]').forEach(btn=>btn.addEventListener('click', async ()=>{
      try{ await callApi('approveMember', Object.assign({name:btn.dataset.approve}, getAuthParams())); openPendingModal(); refreshHeader(); showToast('승인되었습니다.'); }
      catch(err){ showToast(err.message, true); }
    }));
    box.querySelectorAll('[data-reject]').forEach(btn=>btn.addEventListener('click', async ()=>{
      if(!confirm('가입 신청을 거절하시겠습니까?')) return;
      try{ await callApi('rejectMember', Object.assign({name:btn.dataset.reject}, getAuthParams())); openPendingModal(); refreshHeader(); }
      catch(err){ showToast(err.message, true); }
    }));
  }catch(err){ box.innerHTML = errorHtml(err.message); }
}

// ===== 인앱 브라우저 감지 =====
function detectInAppBrowser(){
  const ua = navigator.userAgent || '';
  return /KAKAOTALK|NAVER|Instagram|FBAN|FBAV|Line\//i.test(ua);
}
function openInExternalBrowser(){
  const url = window.location.href;
  const ua = navigator.userAgent || '';
  if(/KAKAOTALK/i.test(ua)) window.location.href = 'kakaotalk://web/openExternal?url='+encodeURIComponent(url);
  else if(/NAVER/i.test(ua)) window.location.href = 'naversearchapp://inappbrowser?app=naversearchapp&url='+encodeURIComponent(url);
  else window.location.href = 'intent://'+url.replace(/^https?:\/\//,'')+'#Intent;scheme=https;package=com.android.chrome;end';
}
function checkInApp(){
  if(detectInAppBrowser()){
    document.getElementById('inappBanner').classList.remove('hidden');
    document.getElementById('inappOpenBtn').addEventListener('click', openInExternalBrowser);
  }
}

// ===== 별 배경 =====
function initStars(){
  const layer = document.getElementById('starLayer');
  const frag = document.createDocumentFragment();
  for(let i=0;i<120;i++){
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random()*100+'%';
    s.style.top = Math.random()*100+'%';
    const size = Math.random()*2+1;
    s.style.width = size+'px';
    s.style.height = size+'px';
    s.style.animationDelay = (Math.random()*5)+'s';
    s.style.animationDuration = (2+Math.random()*3)+'s';
    frag.appendChild(s);
  }
  layer.appendChild(frag);
}

// ===== 정적 이벤트 바인딩 =====
document.querySelectorAll('[data-close]').forEach(btn=>btn.addEventListener('click', ()=>closeModal(btn.dataset.close)));
document.querySelectorAll('.modal-overlay').forEach(overlay=>overlay.addEventListener('click', (e)=>{ if(e.target===overlay) overlay.classList.add('hidden'); }));

document.getElementById('loginForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const name = document.getElementById('loginName').value.trim();
  const pw = document.getElementById('loginPw').value;
  try{
    const res = await callApi('login', {name, pw});
    setUser({name:res.name, dept:res.dept, pw});
    closeModal('loginModal');
    e.target.reset();
    refreshHeader();
    router();
    showToast(res.name+'님, 환영합니다!');
  }catch(err){ showToast(err.message, true); }
});
document.getElementById('gotoSignup').addEventListener('click', (e)=>{ e.preventDefault(); closeModal('loginModal'); openModal('signupModal'); });

document.getElementById('signupForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const name = document.getElementById('signupName').value.trim();
  const dept = document.getElementById('signupDept').value.trim();
  const pw = document.getElementById('signupPw').value;
  const pw2 = document.getElementById('signupPw2').value;
  if(pw!==pw2){ showToast('비밀번호가 일치하지 않습니다.', true); return; }
  try{
    await callApi('signup', {name, dept, pw});
    closeModal('signupModal');
    e.target.reset();
    showToast('가입 신청이 완료되었습니다. 관리자 승인을 기다려주세요.');
  }catch(err){ showToast(err.message, true); }
});

document.getElementById('adminForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const pw = document.getElementById('adminPwInput').value;
  try{
    const res = await callApi('adminCheck', {adminPw:pw});
    if(!res.ok) throw new Error('비밀번호가 올바르지 않습니다.');
    setAdminPw(pw);
    closeModal('adminModal');
    e.target.reset();
    refreshHeader();
    router();
    showToast('관리자 모드로 전환되었습니다.');
  }catch(err){ showToast(err.message, true); }
});

document.getElementById('photoForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const submitBtn = e.target.querySelector('button[type=submit]');
  submitBtn.disabled = true;
  try{
    const params = Object.assign({
      title: document.getElementById('photoTitle').value.trim(),
      category: document.getElementById('photoCategory').value,
      shotAt: document.getElementById('photoShotAt').value.trim(),
      location: document.getElementById('photoLocation').value.trim(),
      equipment: document.getElementById('photoEquipment').value.trim(),
      desc: document.getElementById('photoDesc').value.trim()
    }, getAuthParams());
    let res;
    if(editingPhotoId){
      params.id = editingPhotoId;
      res = await callApi('updatePhoto', params);
      res.id = editingPhotoId;
    } else {
      const file = document.getElementById('photoFile').files[0];
      if(!file) throw new Error('사진 파일을 선택해주세요.');
      showToast('이미지 업로드 중...');
      params.imageData = await resizeImage(file, 1600, 0.85);
      params.fileName = file.name;
      res = await callApi('uploadPhoto', params);
    }
    closeModal('photoModal');
    hideToast();
    location.hash = '#/photo/'+res.id;
    renderPhotoDetail(document.getElementById('app'), res.id);
  }catch(err){
    showToast('저장 실패: '+err.message, true);
  }finally{
    submitBtn.disabled = false;
  }
});

// ===== 초기화 =====
window.addEventListener('hashchange', router);
initStars();
checkInApp();
refreshHeader();
router();
</script>
