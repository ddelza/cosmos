<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cosmos - 천체관측 동아리</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg-deep:#080a1a;
  --bg-navy:#0d1442;
  --bg-navy2:#131b52;
  --card-bg:rgba(255,255,255,0.045);
  --card-border:rgba(232,195,104,0.22);
  --gold:#e8c368;
  --gold-soft:#f2dca0;
  --text:#f2f0e6;
  --text-dim:#a9b0d0;
  --danger:#e26b6b;
  --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:radial-gradient(ellipse at 20% -10%, var(--bg-navy2), var(--bg-deep) 60%);
  color:var(--text);
  font-family:'Noto Sans KR',sans-serif;
  min-height:100vh;
  position:relative;
  overflow-x:hidden;
}
h1,h2,h3,.brand-name{font-family:'Playfair Display',Georgia,serif;}
a{color:inherit;text-decoration:none;}
.hidden{display:none !important;}

#starLayer{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.star{position:absolute;background:#fff;border-radius:50%;opacity:0.6;animation:twinkle 3s ease-in-out infinite;}
@keyframes twinkle{0%,100%{opacity:0.15;}50%{opacity:0.9;}}

.inapp-banner{
  position:relative;z-index:50;background:var(--gold);color:#181022;
  padding:10px 16px;font-size:13px;text-align:center;
  display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;
}
.inapp-banner button{
  background:#181022;color:var(--gold-soft);border:none;border-radius:8px;
  padding:6px 12px;font-weight:700;cursor:pointer;font-size:12px;
}

header{
  position:relative;z-index:10;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 28px;flex-wrap:wrap;gap:12px;
  border-bottom:1px solid var(--card-border);
  background:rgba(8,10,26,0.55);
  backdrop-filter:blur(6px);
  position:sticky;top:0;
}
.brand{display:flex;align-items:center;gap:10px;}
.brand img{height:40px;width:40px;object-fit:contain;border-radius:8px;}
.brand-name{font-size:22px;font-weight:700;color:var(--gold-soft);letter-spacing:1px;}
.nav{display:flex;gap:24px;flex-wrap:wrap;}
.nav-link{font-size:15px;color:var(--text-dim);padding:6px 2px;border-bottom:2px solid transparent;transition:.2s;}
.nav-link:hover,.nav-link.active{color:var(--gold-soft);border-bottom-color:var(--gold);}
.auth-box{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}

.btn{
  border:none;border-radius:9px;padding:9px 16px;font-size:14px;font-weight:600;
  cursor:pointer;font-family:inherit;transition:.15s;
}
.btn-sm{padding:6px 11px;font-size:12.5px;}
.btn-gold{background:linear-gradient(135deg,var(--gold-soft),var(--gold));color:#181022;}
.btn-gold:hover{filter:brightness(1.08);}
.btn-ghost{background:transparent;color:var(--text-dim);border:1px solid var(--card-border);}
.btn-ghost:hover{color:var(--text);border-color:var(--gold);}
.btn-outline-gold{background:transparent;color:var(--gold-soft);border:1px solid var(--gold);}
.btn-outline-gold:hover{background:rgba(232,195,104,0.1);}
.btn-danger{background:transparent;color:var(--danger);border:1px solid rgba(226,107,107,0.5);}
.btn-danger:hover{background:rgba(226,107,107,0.12);}
.btn:disabled{opacity:.5;cursor:not-allowed;}

.user-badge{font-size:14px;color:var(--gold-soft);}
.admin-badge{
  background:rgba(232,195,104,0.15);color:var(--gold-soft);
  padding:5px 12px;border-radius:20px;font-size:12.5px;font-weight:700;
  border:1px solid var(--gold);
}
.badge-count{
  background:var(--danger);color:#fff;border-radius:10px;font-size:10.5px;
  padding:1px 6px;margin-left:5px;
}

main,#app{position:relative;z-index:5;max-width:1180px;margin:0 auto;padding:32px 24px 80px;}
.page-title{font-size:28px;color:var(--gold-soft);margin:0 0 18px;}

.hero{text-align:center;padding:50px 10px 40px;}
.hero-logo{height:110px;width:110px;object-fit:contain;margin-bottom:14px;filter:drop-shadow(0 0 20px rgba(232,195,104,0.35));}
.hero-title{font-size:44px;color:var(--gold-soft);margin:0;letter-spacing:3px;}
.hero-tagline{color:var(--text-dim);margin:10px 0 34px;font-size:15px;}
.hero-nav{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;}
.hero-nav-card{
  background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius);
  padding:26px 34px;display:flex;flex-direction:column;align-items:center;gap:10px;
  min-width:150px;transition:.2s;
}
.hero-nav-card:hover{border-color:var(--gold);transform:translateY(-3px);}
.hero-nav-icon{font-size:30px;}
.home-section{margin-top:56px;}
.home-section-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px;}
.home-section-head h2{font-size:20px;color:var(--gold-soft);margin:0;}
.home-section-head a{font-size:13px;color:var(--text-dim);}
.gallery-grid-preview{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));}
.post-list-preview{display:flex;flex-direction:column;gap:10px;}
.post-preview-item{
  display:block;background:var(--card-bg);border:1px solid var(--card-border);
  border-radius:10px;padding:14px 18px;transition:.15s;
}
.post-preview-item:hover{border-color:var(--gold);}
.post-preview-title{font-weight:700;color:var(--text);}
.post-preview-meta{font-size:12.5px;color:var(--text-dim);margin-top:4px;}

.gallery-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;margin-bottom:20px;}
.gallery-toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
.search-input{
  background:rgba(255,255,255,0.05);border:1px solid var(--card-border);border-radius:20px;
  padding:10px 18px;color:var(--text);font-size:14px;min-width:260px;
}
.search-input::placeholder{color:var(--text-dim);}
.search-input:focus,.text-input:focus,.select-input:focus,textarea:focus{outline:1px solid var(--gold);}

.gallery-layout{display:grid;grid-template-columns:200px 1fr;gap:28px;align-items:start;}
.gallery-sidebar{
  background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius);
  padding:18px;display:flex;flex-direction:column;gap:20px;position:sticky;top:90px;
}
.filter-label{font-size:12.5px;color:var(--gold-soft);font-weight:700;margin-bottom:8px;letter-spacing:.5px;}
.filter-radios{display:flex;flex-direction:column;gap:7px;}
.radio-item{display:flex;align-items:center;gap:7px;font-size:13.5px;color:var(--text-dim);cursor:pointer;}
.radio-item input{accent-color:var(--gold);}
.select-input{
  width:100%;background:rgba(255,255,255,0.05);border:1px solid var(--card-border);
  border-radius:8px;padding:8px 10px;color:var(--text);font-size:13.5px;
}
/* 브라우저 네이티브 드롭다운 팝업은 배경이 흰색으로 강제되는 경우가 많아 옵션 글자색을 따로 지정 */
select option{color:#1a1a2e;background:#fff;}

.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px;}
.photo-card{
  display:block;background:var(--card-bg);border:1px solid var(--card-border);
  border-radius:var(--radius);overflow:hidden;transition:.2s;
}
.photo-card:hover{transform:translateY(-4px);border-color:var(--gold);box-shadow:0 8px 26px rgba(232,195,104,0.15);}
.photo-card-img{
  aspect-ratio:4/3;background-size:cover;background-position:center;background-color:#0a1030;
}
.photo-card-body{padding:12px 14px;}
.photo-card-title{font-weight:700;font-size:15px;margin-bottom:4px;}
.photo-card-meta{font-size:12px;color:var(--text-dim);}

.empty-state,.loading-state,.error-state{
  grid-column:1/-1;text-align:center;padding:50px 20px;color:var(--text-dim);
}
.error-state{color:var(--danger);}

.photo-detail{display:grid;grid-template-columns:1.4fr 1fr;gap:34px;}
.photo-detail-img img{width:100%;border-radius:var(--radius);border:1px solid var(--card-border);}
.tag{
  display:inline-block;background:rgba(232,195,104,0.15);color:var(--gold-soft);
  padding:4px 12px;border-radius:16px;font-size:12px;margin-bottom:14px;
}
.meta-list{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:16px 0;font-size:13.5px;}
.meta-list dt{color:var(--text-dim);}
.meta-list dd{margin:0;}
.photo-desc{line-height:1.7;color:var(--text);white-space:pre-wrap;}
.post-actions{display:flex;gap:10px;margin-top:20px;}
.back-link{display:inline-block;margin-top:24px;color:var(--text-dim);font-size:13.5px;}
.back-link:hover{color:var(--gold-soft);}

.logs-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.post-list{display:flex;flex-direction:column;gap:12px;}
.post-list-item{
  display:block;background:var(--card-bg);border:1px solid var(--card-border);
  border-radius:12px;padding:18px 22px;transition:.15s;
}
.post-list-item:hover{border-color:var(--gold);}
.post-list-title{font-weight:700;font-size:16px;}
.post-list-meta{font-size:12.5px;color:var(--text-dim);margin-top:6px;}

.post-detail .post-meta{color:var(--text-dim);font-size:13px;margin-bottom:20px;}
.post-body{line-height:1.8;font-size:15.5px;}
.post-body img{max-width:100%;border-radius:10px;margin:14px 0;}
.post-body h3{color:var(--gold-soft);margin-top:24px;}
.post-body hr{border:none;border-top:1px solid var(--card-border);margin:24px 0;}

.title-input{width:100%;font-size:22px;font-weight:700;margin-bottom:14px;padding:12px 16px;}
.text-input{
  background:rgba(255,255,255,0.05);border:1px solid var(--card-border);border-radius:9px;
  color:var(--text);font-family:inherit;
}
.editor-wrap{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius);overflow:hidden;}
.editor-toolbar{display:flex;gap:6px;padding:10px;border-bottom:1px solid var(--card-border);flex-wrap:wrap;}
.editor-toolbar button{
  background:rgba(255,255,255,0.06);border:1px solid var(--card-border);color:var(--text-dim);
  border-radius:6px;padding:6px 11px;cursor:pointer;font-size:13px;font-family:inherit;
}
.editor-toolbar button:hover{color:var(--gold-soft);border-color:var(--gold);}
.editor-toolbar select.editor-fontsize{
  background:rgba(255,255,255,0.06);border:1px solid var(--card-border);color:var(--text-dim);
  border-radius:6px;padding:6px 9px;cursor:pointer;font-size:13px;font-family:inherit;
}
.editor-toolbar select.editor-fontsize:hover{color:var(--gold-soft);border-color:var(--gold);}
.editor-body{min-height:340px;padding:20px;line-height:1.8;font-size:15px;}
.editor-body:focus{outline:none;}
.editor-actions{display:flex;gap:10px;margin-top:18px;}
.admin-toolbar{margin-bottom:14px;}
.about-content{line-height:1.85;font-size:15.5px;}
.about-content img{max-width:100%;border-radius:10px;margin:14px 0;}

.modal-overlay{
  position:fixed;inset:0;background:rgba(4,5,16,0.72);
  display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;
}
.modal-box{
  background:var(--bg-navy);border:1px solid var(--card-border);border-radius:var(--radius);
  padding:30px;width:100%;max-width:420px;position:relative;
  box-shadow:0 20px 60px rgba(0,0,0,0.5);max-height:88vh;overflow-y:auto;
}
.modal-box-wide{max-width:600px;}
.modal-box h2{margin:0 0 20px;color:var(--gold-soft);font-size:20px;}
.modal-close{
  position:absolute;top:14px;right:16px;background:none;border:none;color:var(--text-dim);
  font-size:22px;cursor:pointer;line-height:1;
}
.modal-close:hover{color:var(--gold);}
.modal-box form label{display:block;font-size:13px;color:var(--text-dim);margin-bottom:14px;}
.modal-box form input,.modal-box form select,.modal-box form textarea{
  display:block;width:100%;margin-top:6px;background:rgba(255,255,255,0.05);
  border:1px solid var(--card-border);border-radius:8px;padding:9px 12px;
  color:var(--text);font-family:inherit;font-size:14px;
}
.modal-actions{margin-top:8px;display:flex;gap:10px;}
.modal-hint{font-size:12.5px;color:var(--text-dim);margin-top:14px;}
.modal-hint a{color:var(--gold-soft);}

.location-field{position:relative;}
.location-suggestions{
  position:absolute;left:0;right:0;top:100%;margin-top:2px;
  background:var(--bg-navy);border:1px solid var(--gold);border-radius:8px;
  max-height:220px;overflow-y:auto;z-index:20;
  box-shadow:0 10px 30px rgba(0,0,0,0.4);
}
.location-suggestion-item{padding:9px 12px;font-size:13px;color:var(--text);cursor:pointer;border-bottom:1px solid var(--card-border);}
.location-suggestion-item:last-child{border-bottom:none;}
.location-suggestion-item:hover{background:rgba(232,195,104,0.15);color:var(--gold-soft);}
.location-hint{font-size:11.5px;color:var(--text-dim);margin-top:5px;font-weight:400;}

.photo-map{margin:16px 0;border-radius:var(--radius);overflow:hidden;border:1px solid var(--card-border);}
.photo-map iframe{width:100%;height:220px;border:0;display:block;}

.comments-section{margin-top:32px;padding-top:24px;border-top:1px solid var(--card-border);}
.comments-title{font-size:17px;color:var(--gold-soft);margin:0 0 16px;}
.comments-list{display:flex;flex-direction:column;gap:14px;margin-bottom:18px;}
.comment-item{background:var(--card-bg);border:1px solid var(--card-border);border-radius:10px;padding:12px 14px;}
.comment-reply{margin-top:10px;background:rgba(255,255,255,0.03);}
.comment-replies{margin-top:10px;padding-left:16px;border-left:2px solid var(--card-border);display:flex;flex-direction:column;gap:10px;}
.comment-head{display:flex;gap:8px;align-items:baseline;font-size:12.5px;}
.comment-author{font-weight:700;color:var(--gold-soft);}
.comment-date{color:var(--text-dim);}
.comment-content{margin:6px 0 8px;font-size:14px;line-height:1.6;white-space:pre-wrap;}
.comment-actions{display:flex;gap:14px;}
.comment-actions button{background:none;border:none;color:var(--text-dim);font-size:12.5px;cursor:pointer;padding:0;font-family:inherit;}
.comment-actions button:hover{color:var(--gold-soft);}
.comment-like-btn.liked{color:var(--gold);font-weight:700;}
.comment-delete-btn:hover{color:var(--danger);}
.comment-reply-form{margin-top:10px;}
.comment-form,.comment-reply-form{display:flex;flex-direction:column;gap:8px;}
.comment-input{
  width:100%;background:rgba(255,255,255,0.05);border:1px solid var(--card-border);border-radius:8px;
  padding:9px 12px;color:var(--text);font-family:inherit;font-size:13.5px;resize:vertical;
}
.comment-form .comment-submit-btn,.comment-reply-submit-btn{align-self:flex-end;}
.comment-login-hint{color:var(--text-dim);font-size:13px;}
.grade-tag{
  background:rgba(232,195,104,0.15);color:var(--gold-soft);border-radius:12px;
  padding:2px 9px;font-size:11px;font-weight:700;margin-left:6px;
}

/* 장비 자랑 */
.eq-form{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius);padding:24px;}
.eq-form label{display:block;font-size:13px;color:var(--text-dim);margin-bottom:16px;}
.eq-form label input,.eq-form label select{
  display:block;width:100%;margin-top:6px;background:rgba(255,255,255,0.05);
  border:1px solid var(--card-border);border-radius:8px;padding:9px 12px;
  color:var(--text);font-family:inherit;font-size:14px;
}
.eq-form #eqDescMount{margin-bottom:16px;}
.eq-photo-preview{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px;}
.eq-photo-thumb{position:relative;width:90px;height:90px;border-radius:8px;overflow:hidden;border:1px solid var(--card-border);}
.eq-photo-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.eq-photo-remove{
  position:absolute;top:2px;right:2px;background:rgba(4,5,16,0.75);color:#fff;border:none;
  border-radius:50%;width:20px;height:20px;line-height:18px;cursor:pointer;font-size:13px;
}
.eq-no-photo{display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:13px;}
.eq-no-photo-lg{
  display:flex;align-items:center;justify-content:center;height:280px;color:var(--text-dim);
  background:rgba(255,255,255,0.03);border:1px solid var(--card-border);border-radius:var(--radius);
}
.eq-carousel{position:relative;border-radius:var(--radius);overflow:hidden;border:1px solid var(--card-border);}
.eq-carousel-track{display:flex;transition:transform .3s ease;}
.eq-carousel-slide{flex:0 0 100%;}
.eq-carousel-slide img{width:100%;display:block;}
.eq-carousel-btn{
  position:absolute;top:50%;transform:translateY(-50%);background:rgba(4,5,16,0.55);color:#fff;
  border:none;width:36px;height:36px;border-radius:50%;font-size:20px;cursor:pointer;line-height:1;
}
.eq-carousel-prev{left:10px;}
.eq-carousel-next{right:10px;}
.eq-carousel-dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:6px;}
.eq-carousel-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,0.4);cursor:pointer;}
.eq-carousel-dot.active{background:var(--gold);}

.pending-list{display:flex;flex-direction:column;gap:10px;max-height:60vh;overflow-y:auto;}
.pending-item{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  background:rgba(255,255,255,0.04);border:1px solid var(--card-border);
  border-radius:10px;padding:12px 14px;flex-wrap:wrap;
}
.pending-date{color:var(--text-dim);font-size:11.5px;margin-left:6px;}
.pending-actions{display:flex;gap:8px;}

#toast{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%);
  background:var(--gold);color:#181022;padding:12px 22px;border-radius:10px;
  font-size:13.5px;font-weight:600;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,0.4);
}
#toast.toast-error{background:var(--danger);color:#fff;}

footer{position:relative;z-index:5;text-align:center;padding:26px;color:var(--text-dim);font-size:12px;border-top:1px solid var(--card-border);}

@media (max-width:820px){
  .gallery-layout{grid-template-columns:1fr;}
  .gallery-sidebar{position:static;flex-direction:row;flex-wrap:wrap;}
  .photo-detail{grid-template-columns:1fr;}
  header{padding:12px 16px;}
  main,#app{padding:24px 16px 60px;}
}
</style>
</head>
<body>

<div id="starLayer"></div>

<div id="inappBanner" class="inapp-banner hidden">
  인앱 브라우저에서는 일부 기능이 제대로 동작하지 않을 수 있습니다.
  <button id="inappOpenBtn" type="button">외부 브라우저로 열기</button>
</div>

<header>
  <a href="#/" class="brand">
    <img src="logo.png" alt="Cosmos 로고">
    <span class="brand-name">Cosmos</span>
  </a>
  <nav class="nav">
    <a href="#/about" class="nav-link" data-route="about">소개</a>
    <a href="#/gallery" class="nav-link" data-route="gallery">갤러리</a>
    <a href="#/logs" class="nav-link" data-route="logs">탐구 일지</a>
    <a href="#/activity" class="nav-link" data-route="activity">활동 기록</a>
    <a href="#/equipment" class="nav-link" data-route="equipment">장비 자랑</a>
    <a href="#/alumni" class="nav-link" data-route="alumni">졸업생 게시판</a>
  </nav>
  <div class="auth-box" id="authBox"></div>
</header>

<div id="app"></div>

<footer>Cosmos 천체관측 동아리</footer>

<div id="toast" class="hidden"></div>

<div class="modal-overlay hidden" id="loginModal">
  <div class="modal-box">
    <button type="button" class="modal-close" data-close="loginModal">&times;</button>
    <h2>로그인</h2>
    <form id="loginForm">
      <label>이름<input type="text" id="loginName" required></label>
      <label>비밀번호<input type="password" id="loginPw" required></label>
      <div class="modal-actions"><button type="submit" class="btn btn-gold">로그인</button></div>
      <p class="modal-hint">계정이 없으신가요? <a href="#" id="gotoSignup">회원가입</a></p>
    </form>
  </div>
</div>

<div class="modal-overlay hidden" id="signupModal">
  <div class="modal-box">
    <button type="button" class="modal-close" data-close="signupModal">&times;</button>

const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzSq6cCBwDGRDc7tlNJLu-p5QhXi7tMTNwAMOvUBE7Xp6zC6T0Z_RvZxrE-v6R0F8-gKg/exec';

// ===== 유틸 =====
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function norm(s){
  return String(s==null?'':s).replace(/[\s　​]/g,'').normalize('NFC');
}
function debounce(fn, ms){
  let t;
  return (...args)=>{ clearTimeout(t); t=setTimeout(()=>fn(...args), ms); };
}
function sanitizeHtml(html){
  const doc = new DOMParser().parseFromString(html || '', 'text/html');
  const allowed = new Set(['P','BR','B','STRONG','I','EM','U','H1','H2','H3','H4','UL','OL','LI','IMG','A','HR','DIV','SPAN','BLOCKQUOTE']);
  const walk = (node)=>{
    [...node.childNodes].forEach(child=>{
      if(child.nodeType===1){
        if(!allowed.has(child.tagName)){
          child.replaceWith(...child.childNodes);
          return;
        }
        [...child.attributes].forEach(attr=>{
          const name = attr.name.toLowerCase();
          if(name==='style'){
            const kept = [];
            const fs = attr.value.match(/font-size\s*:\s*(\d+(?:\.\d+)?)(px|em|rem)/i);
            if(fs) kept.push('font-size:'+fs[1]+fs[2]);
            const ta = attr.value.match(/text-align\s*:\s*(left|center|right|justify)/i);
            if(ta) kept.push('text-align:'+ta[1]);
            if(kept.length) child.setAttribute('style', kept.join(';'));
            else child.removeAttribute('style');
            return;
          }
          const ok = (child.tagName==='IMG' && (name==='src'||name==='alt')) ||
                     (child.tagName==='A' && (name==='href'||name==='target'));
          if(!ok) child.removeAttribute(attr.name);
        });
        walk(child);
      } else if(child.nodeType===8){
        child.remove();
      }
    });
  };
  walk(doc.body);
  return doc.body.innerHTML;
}
function resizeImage(file, maxDim, quality){
  maxDim = maxDim || 1600; quality = quality || 0.85;
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let {width, height} = img;
        if(width>maxDim || height>maxDim){
          if(width>height){ height=Math.round(height*maxDim/width); width=maxDim; }
          else { width=Math.round(width*maxDim/height); height=maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width=width; canvas.height=height;
        canvas.getContext('2d').drawImage(img,0,0,width,height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ===== 촬영 장소 검색 (OpenStreetMap Nominatim, API 키 불필요) =====
async function searchPlace(query){
  const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=6&accept-language=ko&q='+encodeURIComponent(query);
  const res = await fetchWithTimeout(url, {}, 8000);
  return res.json();
}
function initLocationSearch(input, suggestBox, latInput, lngInput, hintEl){
  let debounceTimer;
  input.addEventListener('input', ()=>{
    latInput.value = '';
    lngInput.value = '';
    if(hintEl) hintEl.classList.add('hidden');
    clearTimeout(debounceTimer);
    const q = input.value.trim();
    if(q.length<2){ suggestBox.classList.add('hidden'); return; }
    debounceTimer = setTimeout(async ()=>{
      try{
        const results = await searchPlace(q);
        if(!results || !results.length){ suggestBox.classList.add('hidden'); return; }
        suggestBox.dataset.results = JSON.stringify(results);
        suggestBox.innerHTML = results.map((r,i)=>`<div class="location-suggestion-item" data-idx="${i}">${esc(r.display_name)}</div>`).join('');
        suggestBox.classList.remove('hidden');
      }catch(e){ suggestBox.classList.add('hidden'); }
    }, 600);
  });
  suggestBox.addEventListener('click', (e)=>{
    const item = e.target.closest('.location-suggestion-item');
    if(!item) return;
    const results = JSON.parse(suggestBox.dataset.results||'[]');
    const r = results[Number(item.dataset.idx)];
    if(!r) return;
    input.value = r.display_name;
    latInput.value = r.lat;
    lngInput.value = r.lon;
    suggestBox.classList.add('hidden');
    if(hintEl){ hintEl.textContent = '📍 지도 위치 저장됨 ('+Number(r.lat).toFixed(4)+', '+Number(r.lon).toFixed(4)+')'; hintEl.classList.remove('hidden'); }
  });
  document.addEventListener('click', (e)=>{
    if(e.target!==input && !suggestBox.contains(e.target)) suggestBox.classList.add('hidden');
  });
}

// ===== API (fetch POST, 커스텀 헤더 없이 simple request로 유지 → CORS preflight 회피) =====
function fetchWithTimeout(url, opts, ms){
  const controller = new AbortController();
  const t = setTimeout(()=>controller.abort(), ms);
  return fetch(url, Object.assign({}, opts, {signal:controller.signal})).finally(()=>clearTimeout(t));
}
async function callApiOnce(action, params){
  const body = new URLSearchParams(Object.assign({action}, params||{}));
  const res = await fetchWithTimeout(APPS_SCRIPT_URL, {method:'POST', body}, 15000);
  return res.json();
}
async function callApi(action, params){
  let data;
  try{
    data = await callApiOnce(action, params);
  }catch(networkErr){
    await new Promise(r=>setTimeout(r,1200));
    data = await callApiOnce(action, params);
  }
  if(data && data.error) throw new Error(data.error);
  return data;
}

function applyFontSize(px){
  const sel = window.getSelection();
  if(!sel || !sel.rangeCount || sel.isCollapsed){
    showToast('먼저 글자를 선택해주세요.', true);
    return;
  }
  const range = sel.getRangeAt(0);
  const span = document.createElement('span');
  span.style.fontSize = px;
  try{
    range.surroundContents(span);
  }catch(e){
    const frag = range.extractContents();
    span.appendChild(frag);
    range.insertNode(span);
  }
  sel.removeAllRanges();
  const newRange = document.createRange();
  newRange.selectNodeContents(span);
  sel.addRange(newRange);
}
function mountEditor(initialHtml){

      <input type="file" accept="image/*" class="hidden editor-img-input">
    </div>
    <div class="editor-body" contenteditable="true">${initialHtml||''}</div>
  `;
  wrap.querySelectorAll('[data-cmd]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.execCommand(btn.dataset.cmd, false, btn.dataset.value||null);
      wrap.querySelector('.editor-body').focus();
    });
  });
  const fontSizeSelect = wrap.querySelector('.editor-fontsize');
  fontSizeSelect.addEventListener('change', ()=>{
    const val = fontSizeSelect.value;
    fontSizeSelect.value = '';
    if(!val) return;
    wrap.querySelector('.editor-body').focus();
    applyFontSize(val);
  });
  const imgInput = wrap.querySelector('.editor-img-input');
  wrap.querySelector('.editor-img-btn').addEventListener('click', ()=>imgInput.click());
  imgInput.addEventListener('change', async ()=>{
    const file = imgInput.files[0];
    if(!file) return;
    wrap.querySelector('.editor-body').focus();
    try{
      showToast('이미지 업로드 중...');
      const dataUrl = await resizeImage(file, 1600, 0.85);
      const res = await callApi('uploadImage', Object.assign({imageData:dataUrl, fileName:file.name}, getAuthParams()));
      document.execCommand('insertImage', false, res.url);
      hideToast();
    }catch(err){ showToast('이미지 업로드 실패: '+err.message, true); }
    imgInput.value = '';
  });
  wrap.getContent = ()=>sanitizeHtml(wrap.querySelector('.editor-body').innerHTML);
  return wrap;
}

// ===== 댓글 / 대댓글 / 좋아요 (갤러리 · 탐구일지 · 졸업생게시판 공용) =====
async function mountComments(container, targetType, targetId){
  container.innerHTML = `
    <div class="comments-section">
      <h3 class="comments-title">댓글</h3>
      <div class="comments-list">${loadingHtml()}</div>
      ${canCommentOrLike() ? `
        <div class="comment-form">
          <textarea class="comment-input" placeholder="댓글을 입력하세요" rows="2"></textarea>
          <button type="button" class="btn btn-gold btn-sm comment-submit-btn">등록</button>
        </div>
      ` : `<div class="comment-login-hint">댓글을 작성하려면 로그인이 필요합니다.</div>`}
    </div>
  `;
  const listEl = container.querySelector('.comments-list');
  async function reload(){
    listEl.innerHTML = loadingHtml();
    try{
      const res = await callApi('listComments', Object.assign({targetType, targetId}, getAuthParams()));
      const list = res.list || [];
      listEl.innerHTML = list.length ? list.map(c=>commentItemHtml(c)).join('') : '<div class="empty-state">첫 댓글을 남겨보세요.</div>';
      bindCommentEvents(listEl, targetType, targetId, reload);
    }catch(err){ listEl.innerHTML = errorHtml(err.message); }
  }
  const submitBtn = container.querySelector('.comment-submit-btn');
  if(submitBtn){
    submitBtn.addEventListener('click', async ()=>{
      const ta = container.querySelector('.comment-form .comment-input');
      const content = ta.value.trim();
      if(!content){ showToast('댓글 내용을 입력해주세요.', true); return; }
      submitBtn.disabled = true;
      try{
        await callApi('addComment', Object.assign({targetType, targetId, content}, getAuthParams()));
        ta.value = '';
        await reload();
      }catch(err){ showToast('댓글 등록 실패: '+err.message, true); }
      finally{ submitBtn.disabled = false; }
    });
  }
  reload();
}
function commentItemHtml(c){
  const canDelete = (getUser() && norm(getUser().name)===norm(c.author)) || isFullAdmin();
  const replies = (c.replies||[]).map(r=>commentItemHtml(r)).join('');
  return `
    <div class="comment-item" data-id="${c.id}">
      <div class="comment-head">
        <span class="comment-author">${esc(c.author)}</span>
        <span class="comment-date">${esc(c.createdAt)}</span>
      </div>
      <div class="comment-content">${esc(c.content)}</div>
      <div class="comment-actions">
        <button type="button" class="comment-like-btn ${c.likedByMe?'liked':''}" data-comment-id="${c.id}">👍 좋아요${c.likeCount>0?' '+c.likeCount:''}</button>
        ${(!c.parentId && canCommentOrLike()) ? `<button type="button" class="comment-reply-btn" data-comment-id="${c.id}">답글</button>` : ''}
        ${canDelete ? `<button type="button" class="comment-delete-btn" data-comment-id="${c.id}">삭제</button>` : ''}
      </div>
      ${!c.parentId ? `<div class="comment-reply-form hidden" data-parent-id="${c.id}">
        <textarea class="comment-input" placeholder="답글을 입력하세요" rows="2"></textarea>
        <button type="button" class="btn btn-gold btn-sm comment-reply-submit-btn" data-parent-id="${c.id}">등록</button>
      </div>` : ''}
      ${replies ? `<div class="comment-replies">${replies}</div>` : ''}
    </div>
  `;
}
function bindCommentEvents(listEl, targetType, targetId, reload){
  listEl.querySelectorAll('.comment-like-btn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!canCommentOrLike()){ showToast('좋아요는 로그인 후 가능합니다.', true); return; }
      btn.disabled = true;
      try{
        await callApi('toggleLike', Object.assign({commentId: btn.dataset.commentId}, getAuthParams()));
        await reload();
      }catch(err){ showToast(err.message, true); btn.disabled = false; }
    });
  });
  listEl.querySelectorAll('.comment-reply-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const form = listEl.querySelector(`.comment-reply-form[data-parent-id="${btn.dataset.commentId}"]`);
      if(form) form.classList.toggle('hidden');
    });
  });
  listEl.querySelectorAll('.comment-reply-submit-btn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const form = btn.closest('.comment-reply-form');
      const ta = form.querySelector('.comment-input');
      const content = ta.value.trim();
      if(!content){ showToast('답글 내용을 입력해주세요.', true); return; }
      btn.disabled = true;
      try{
        await callApi('addComment', Object.assign({targetType, targetId, parentId: btn.dataset.parentId, content}, getAuthParams()));
        await reload();
      }catch(err){ showToast('답글 등록 실패: '+err.message, true); btn.disabled = false; }
    });
  });
  listEl.querySelectorAll('.comment-delete-btn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!confirm('댓글을 삭제하시겠습니까?')) return;
      try{
        await callApi('deleteComment', Object.assign({id: btn.dataset.commentId}, getAuthParams()));
        await reload();
      }catch(err){ showToast('삭제 실패: '+err.message, true); }
    });
  });
}

// ===== 라우터 =====
function parseHash(){
  const raw = location.hash.slice(1);
  const [pathPart, queryPart] = raw.split('?');
  const segments = pathPart.split('/').filter(Boolean);
  return {segments, query:new URLSearchParams(queryPart||'')};
}
function updateNavActive(path){
  document.querySelectorAll('.nav-link').forEach(a=>a.classList.toggle('active', a.dataset.route===path));
}
function router(){
  const {segments} = parseHash();
  const path = segments[0] || '';
  const app = document.getElementById('app');
  updateNavActive(path);
  closeAllModals();
  if(path==='') renderHome(app);
  else if(path==='about') renderAbout(app);
  else if(path==='gallery') renderGallery(app);
  else if(path==='photo') renderPhotoDetail(app, segments[1]);
  else if(path==='logs') renderLogs(app, 'research');
  else if(path==='activity') renderLogs(app, 'activity');
  else if(path==='alumni') renderLogs(app, 'alumni');
  else if(path==='post') renderPostDetail(app, segments[1], segments[2]);
  else if(path==='write') renderWrite(app, segments[1], segments[2]);
  else if(path==='equipment') segments[1] ? renderEquipmentDetail(app, segments[1]) : renderEquipmentList(app);
  else if(path==='equipment-write') renderEquipmentWrite(app, segments[1]);
  else renderHome(app);
  window.scrollTo(0,0);
}

function galleryPageHtml(){
  return `
    <div class="gallery-header">

      <div class="gallery-toolbar">
        <input type="text" id="gallerySearch" class="search-input" placeholder="천체, 날짜, 관측 장소 검색...">

          </select>
        </div>
      </aside>
      <div class="gallery-grid" id="galleryGrid"></div>
    </div>
  `;

function bindGalleryEvents(){
  const search = document.getElementById('gallerySearch');
  if(search) search.addEventListener('input', debounce(()=>{ galleryFilters.q=search.value; applyGalleryFilters(); }, 200));
  const sortSel = document.getElementById('sortFilter');
  if(sortSel) sortSel.addEventListener('change', ()=>{ galleryFilters.sort=sortSel.value; applyGalleryFilters(); });
  const uploadBtn = document.getElementById('openUploadBtn');
  if(uploadBtn) uploadBtn.addEventListener('click', ()=>openPhotoModal());
}
function applyGalleryFilters(){
  const catBox = document.getElementById('categoryFilters');
  if(catBox && !catBox.dataset.built){
    catBox.innerHTML = CATEGORIES.map(c=>`
      <label class="radio-item">
        <input type="radio" name="categoryFilter" value="${esc(c)}" ${galleryFilters.category===c?'checked':''}>
        ${esc(c)}
      </label>`).join('');
    catBox.dataset.built = '1';
    catBox.addEventListener('change', (e)=>{ galleryFilters.category=e.target.value; applyGalleryFilters(); });
  }
  const locSel = document.getElementById('locationFilter');
  const eqSel = document.getElementById('equipmentFilter');
  if(locSel && !locSel.dataset.built){
    const locs = ['전체', ...new Set(galleryCache.map(g=>g.location).filter(Boolean))];
    locSel.innerHTML = locs.map(l=>`<option value="${esc(l)}">${esc(l)}</option>`).join('');
    locSel.dataset.built = '1';
    locSel.addEventListener('change', ()=>{ galleryFilters.location=locSel.value; applyGalleryFilters(); });
  }
  if(eqSel && !eqSel.dataset.built){
    const eqs = ['전체', ...new Set(galleryCache.map(g=>g.equipment).filter(Boolean))];
    eqSel.innerHTML = eqs.map(l=>`<option value="${esc(l)}">${esc(l)}</option>`).join('');
    eqSel.dataset.built = '1';
    eqSel.addEventListener('change', ()=>{ galleryFilters.equipment=eqSel.value; applyGalleryFilters(); });
  }

  let list = galleryCache.slice();
  const q = galleryFilters.q.trim().toLowerCase();
  if(q) list = list.filter(g=>[g.title,g.desc,g.location].some(v=>String(v||'').toLowerCase().includes(q)));
  if(galleryFilters.category!=='전체') list = list.filter(g=>g.category===galleryFilters.category);
  if(galleryFilters.location!=='전체') list = list.filter(g=>g.location===galleryFilters.location);
  if(galleryFilters.equipment!=='전체') list = list.filter(g=>g.equipment===galleryFilters.equipment);
  if(galleryFilters.sort==='popular') list.sort((a,b)=>(b.views||0)-(a.views||0));
  else list.sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));

  const grid = document.getElementById('galleryGrid');
  grid.innerHTML = list.length ? list.map(galleryCardHtml).join('') : '<div class="empty-state">조건에 맞는 사진이 없습니다.</div>';
}

function bindEquipmentCarousel(container){
  const carousel = container.querySelector('.eq-carousel');
  if(!carousel) return;
  const track = carousel.querySelector('.eq-carousel-track');
  const slides = carousel.querySelectorAll('.eq-carousel-slide');
  const dots = carousel.querySelectorAll('.eq-carousel-dot');
  let idx = 0;
  function goTo(i){
    idx = (i+slides.length)%slides.length;
    track.style.transform = 'translateX(-'+(idx*100)+'%)';
    dots.forEach((d,j)=>d.classList.toggle('active', j===idx));
  }
  const prevBtn = carousel.querySelector('.eq-carousel-prev');
  const nextBtn = carousel.querySelector('.eq-carousel-next');
  if(prevBtn) prevBtn.addEventListener('click', ()=>goTo(idx-1));
  if(nextBtn) nextBtn.addEventListener('click', ()=>goTo(idx+1));
  dots.forEach(d=>d.addEventListener('click', ()=>goTo(Number(d.dataset.dot))));
}

async function renderEquipmentDetail(app, id){
  app.innerHTML = pageShell('equipment-page', loadingHtml());
  let eq;
  try{ eq = await callApi('getEquipment', {id}); }
  catch(err){ app.innerHTML = pageShell('equipment-page', errorHtml(err.message)); return; }
  const canEdit = (getUser() && norm(getUser().name)===norm(eq.author)) || isFullAdmin();
  const kindLine = eq.kind==='망원경이 아님' ? (eq.kindOther||'망원경이 아님') : eq.kind;
  const subLine = eq.subKind==='기타' ? (eq.subKindOther||'기타') : eq.subKind;
  const mountLine = eq.mount==='기타' ? (eq.mountOther||'기타') : eq.mount;
  app.innerHTML = pageShell('equipment-page', `
    <div class="photo-detail">
      <div class="photo-detail-img">
        ${eq.images.length ? equipmentCarouselHtml(eq.images) : '<div class="eq-no-photo-lg">📷 등록된 사진이 없습니다</div>'}
      </div>
      <div class="photo-detail-info">
        <h1 class="page-title">${esc(eq.title)}</h1>
        <dl class="meta-list">
          <dt>모델명</dt><dd>${esc(eq.model||'-')}</dd>
          <dt>종류</dt><dd>${esc(kindLine||'-')}</dd>
          ${subLine ? `<dt>세부 분류</dt><dd>${esc(subLine)}</dd>` : ''}
          ${mountLine ? `<dt>가대 종류</dt><dd>${esc(mountLine)}</dd>` : ''}
          <dt>제작 회사</dt><dd>${esc(eq.maker||'-')}</dd>
          <dt>작성자</dt><dd>${esc(eq.author)}</dd>
          <dt>등록일</dt><dd>${esc(eq.createdAt)}</dd>
        </dl>
        <div class="post-body">${sanitizeHtml(eq.desc)}</div>
        ${canEdit ? `<div class="post-actions">
          <a href="#/equipment-write/${eq.id}" class="btn btn-ghost">수정</a>
          <button type="button" class="btn btn-danger" id="deleteEqBtn">삭제</button>
        </div>` : ''}
        <a href="#/equipment" class="back-link">← 장비 자랑 목록으로</a>
        <div id="commentsContainer"></div>
      </div>
    </div>
  `);
  bindEquipmentCarousel(app);
  if(canEdit){
    document.getElementById('deleteEqBtn').addEventListener('click', async ()=>{
      if(!confirm('정말 삭제하시겠습니까?')) return;
      try{
        await callApi('deleteEquipment', Object.assign({id:eq.id}, getAuthParams()));
        location.hash = '#/equipment';
      }catch(err){ showToast('삭제 실패: '+err.message, true); }
    });
  }
  mountComments(document.getElementById('commentsContainer'), 'equipment', eq.id);
}

async function renderEquipmentWrite(app, id){
  if(!getUser() && !isAdminMode()){
    app.innerHTML = pageShell('write-page', requireLoginHtml('글을 작성하려면 로그인이 필요합니다.'));
    bindRequireLoginEvents(app);
    return;
  }
  if(!id && !canPostBoard('equipment')){
    app.innerHTML = pageShell('write-page', errorHtml('장비 자랑은 재학생·졸업생·관리자만 작성할 수 있습니다.'));
    return;
  }
  let eq = {title:'', model:'', kind:'', kindOther:'', subKind:'', subKindOther:'', mount:'', mountOther:'', maker:'', desc:'', images:[], author:null};
  if(id){
    app.innerHTML = pageShell('write-page', loadingHtml());
    try{ eq = await callApi('getEquipment', {id}); }
    catch(err){ app.innerHTML = pageShell('write-page', errorHtml(err.message)); return; }
    if(getUser() && norm(eq.author)!==norm(getUser().name) && !isFullAdmin()){
      app.innerHTML = pageShell('write-page', errorHtml('본인 글만 수정할 수 있습니다.'));
      return;
    }
  }
  app.innerHTML = pageShell('write-page', `
    <h1 class="page-title">${id ? '장비 자랑 수정' : '장비 자랑 작성'}</h1>
    <div class="eq-form">
      <label>제목<input type="text" id="eqTitle" class="text-input" value="${esc(eq.title)}"></label>
      <label>망원경 모델명<input type="text" id="eqModel" class="text-input" value="${esc(eq.model)}"></label>
      <label>망원경 종류(집광방식)
        <select id="eqKind" class="select-input">
          <option value="">선택 안 함</option>
          <option value="굴절">굴절</option>
          <option value="반사">반사</option>
          <option value="복합">복합</option>
          <option value="망원경이 아님">망원경이 아님</option>
        </select>
      </label>
      <div id="eqKindOtherWrap" class="hidden">
        <label>무엇인가요? (직접 작성)<input type="text" id="eqKindOther" class="text-input" value="${esc(eq.kindOther)}"></label>
      </div>
      <div id="eqSubKindWrap">
        <label>망원경 세부 분류(집광방식)
          <select id="eqSubKind" class="select-input"></select>
        </label>
        <div id="eqSubKindOtherWrap" class="hidden">
          <label>세부 분류 직접 작성<input type="text" id="eqSubKindOther" class="text-input" value="${esc(eq.subKindOther)}"></label>
        </div>
      </div>
      <div id="eqMountWrap">
        <label>가대 종류
          <select id="eqMount" class="select-input">
            <option value="">선택 안 함</option>
            ${EQUIPMENT_MOUNT_OPTIONS.map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('')}
          </select>
        </label>
        <div id="eqMountOtherWrap" class="hidden">
          <label>가대 종류 직접 작성<input type="text" id="eqMountOther" class="text-input" value="${esc(eq.mountOther)}"></label>
        </div>
      </div>
      <label>제작 회사<input type="text" id="eqMaker" class="text-input" value="${esc(eq.maker)}"></label>
      <label>장비 설명</label>
      <div id="eqDescMount"></div>
      <label>사진 첨부 (여러 장 가능)<input type="file" id="eqPhotos" accept="image/*" multiple></label>
      <div id="eqPhotoPreview" class="eq-photo-preview"></div>
    </div>
    <div class="editor-actions">
      <button type="button" class="btn btn-gold" id="eqSaveBtn">저장</button>
      <a href="#/equipment" class="btn btn-ghost">취소</a>
    </div>
  `);

  const descEditor = mountEditor(eq.desc);
  document.getElementById('eqDescMount').appendChild(descEditor);

  const kindSel = document.getElementById('eqKind');
  const subSel = document.getElementById('eqSubKind');
  function updateKindUI(){
    const kind = kindSel.value;
    document.getElementById('eqKindOtherWrap').classList.toggle('hidden', kind!=='망원경이 아님');
    const isTelescope = kind==='굴절' || kind==='반사' || kind==='복합';
    document.getElementById('eqSubKindWrap').classList.toggle('hidden', !isTelescope);
    document.getElementById('eqMountWrap').classList.toggle('hidden', !isTelescope);
    const options = EQUIPMENT_SUBKIND_OPTIONS[kind] || [];
    subSel.innerHTML = '<option value="">선택 안 함</option>' + options.map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('');
    document.getElementById('eqSubKindOtherWrap').classList.add('hidden');
  }
  kindSel.value = eq.kind || '';
  updateKindUI();
  if(eq.subKind){ subSel.value = eq.subKind; document.getElementById('eqSubKindOtherWrap').classList.toggle('hidden', eq.subKind!=='기타'); }
  kindSel.addEventListener('change', updateKindUI);
  subSel.addEventListener('change', ()=>{
    document.getElementById('eqSubKindOtherWrap').classList.toggle('hidden', subSel.value!=='기타');
  });
  const mountSel = document.getElementById('eqMount');
  mountSel.value = eq.mount || '';
  document.getElementById('eqMountOtherWrap').classList.toggle('hidden', eq.mount!=='기타');
  mountSel.addEventListener('change', ()=>{
    document.getElementById('eqMountOtherWrap').classList.toggle('hidden', mountSel.value!=='기타');
  });

  let eqNewFiles = [];
  let eqKeptExisting = (eq.images||[]).map(img=>img.fileId);
  function renderEqPhotoPreview(){
    const box = document.getElementById('eqPhotoPreview');
    const existingHtml = eqKeptExisting.map((fid,i)=>`
      <div class="eq-photo-thumb">
        <img src="https://drive.google.com/thumbnail?id=${fid}&sz=w200">
        <button type="button" class="eq-photo-remove" data-existing-idx="${i}">×</button>
      </div>`).join('');
    const newHtml = eqNewFiles.map((f,i)=>`
      <div class="eq-photo-thumb">
        <img src="${URL.createObjectURL(f)}">
        <button type="button" class="eq-photo-remove" data-new-idx="${i}">×</button>
      </div>`).join('');
    box.innerHTML = (existingHtml+newHtml) || '<div class="empty-state" style="padding:14px;">선택된 사진이 없습니다.</div>';
    box.querySelectorAll('[data-existing-idx]').forEach(btn=>btn.addEventListener('click', ()=>{
      eqKeptExisting.splice(Number(btn.dataset.existingIdx),1);
      renderEqPhotoPreview();
    }));
    box.querySelectorAll('[data-new-idx]').forEach(btn=>btn.addEventListener('click', ()=>{
      eqNewFiles.splice(Number(btn.dataset.newIdx),1);
      renderEqPhotoPreview();
    }));
  }
  renderEqPhotoPreview();
  document.getElementById('eqPhotos').addEventListener('change', (e)=>{
    eqNewFiles = eqNewFiles.concat(Array.from(e.target.files));
    e.target.value = '';
    renderEqPhotoPreview();
  });

  document.getElementById('eqSaveBtn').addEventListener('click', async ()=>{
    const title = document.getElementById('eqTitle').value.trim();
    if(!title){ showToast('제목을 입력해주세요.', true); return; }
    const saveBtn = document.getElementById('eqSaveBtn');
    saveBtn.disabled = true;
    try{
      const newFileIds = [];
      for(const file of eqNewFiles){
        showToast('사진 업로드 중... ('+(newFileIds.length+1)+'/'+eqNewFiles.length+')');
        const dataUrl = await resizeImage(file, 1600, 0.85);
        const res = await callApi('uploadImage', Object.assign({imageData:dataUrl, fileName:file.name}, getAuthParams()));
        newFileIds.push(res.fileId);
      }
      const images = eqKeptExisting.concat(newFileIds);
      const params = Object.assign({
        title,
        model: document.getElementById('eqModel').value.trim(),
        kind: kindSel.value,
        kindOther: document.getElementById('eqKindOther').value.trim(),
        subKind: subSel.value,
        subKindOther: document.getElementById('eqSubKindOther').value.trim(),
        mount: mountSel.value,
        mountOther: document.getElementById('eqMountOther').value.trim(),
        maker: document.getElementById('eqMaker').value.trim(),
        desc: descEditor.getContent(),
        images: JSON.stringify(images)
      }, getAuthParams());
      if(id) params.id = id;
      hideToast();
      const res = await callApi('saveEquipment', params);
      location.hash = '#/equipment/'+res.id;
      renderEquipmentDetail(document.getElementById('app'), res.id);
    }catch(err){ showToast('저장 실패: '+err.message, true); }
    finally{ saveBtn.disabled = false; }
  });
}

// ===== 헤더 =====
async function refreshHeader(){
  const user = getUser();
  const admin = isAdminMode();
  const fullAdmin = isFullAdmin();
  const authBox = document.getElementById('authBox');
  let html = '';
  if(fullAdmin){
    html += `<span class="admin-badge">관리자${admin?' 모드':''}</span>
             <button type="button" class="btn btn-ghost btn-sm" id="pendingBtn">가입 승인<span id="pendingCount" class="badge-count hidden">0</span></button>`;
    if(admin) html += `<button type="button" class="btn btn-ghost btn-sm" id="adminExitBtn">관리자 종료</button>`;
  }
  if(user){
    html += `<span class="user-badge">${esc(user.name)}님</span>
             <button type="button" class="btn btn-ghost btn-sm" id="logoutBtn">로그아웃</button>`;
  } else if(!admin){
    html += `<button type="button" class="btn btn-ghost btn-sm" id="loginBtn">로그인</button>
             <button type="button" class="btn btn-ghost btn-sm" id="signupBtn">회원가입</button>`;
  }
  if(!admin){
    html += `<button type="button" class="btn btn-outline-gold btn-sm" id="adminBtn">관리자 모드</button>`;
  }
  authBox.innerHTML = html;

  const bind = (id, fn)=>{ const el=document.getElementById(id); if(el) el.addEventListener('click', fn); };
  bind('loginBtn', ()=>openModal('loginModal'));
  bind('signupBtn', ()=>openModal('signupModal'));
  bind('adminBtn', ()=>openModal('adminModal'));
  bind('logoutBtn', ()=>{ clearUser(); refreshHeader(); router(); showToast('로그아웃되었습니다.'); });
  bind('adminExitBtn', ()=>{ clearAdmin(); refreshHeader(); router(); showToast('관리자 모드를 종료했습니다.'); });
  bind('pendingBtn', ()=>openPendingModal());

  if(fullAdmin){
    try{
      const res = await callApi('listPending', getAuthParams());
      const count = (res.list||[]).length;
      const badge = document.getElementById('pendingCount');
      if(badge){ badge.textContent = count; badge.classList.toggle('hidden', count===0); }
    }catch(e){}
  }
}

async function openPendingModal(){
  openModal('pendingModal');
  const box = document.getElementById('pendingList');
  box.innerHTML = loadingHtml();
  try{
    const res = await callApi('listPending', getAuthParams());
    const list = res.list || [];
    box.innerHTML = list.length ? list.map(m=>`
      <div class="pending-item">
        <div><strong>${esc(m.name)}</strong> · ${esc(m.dept)}<span class="grade-tag">${esc(m.grade||'일반회원')}${m.cohort?' '+esc(m.cohort)+'기':''}</span><span class="pending-date">${esc(m.date)}</span></div>
        <div class="pending-actions">
          <button type="button" class="btn btn-gold btn-sm" data-approve="${esc(m.name)}">승인</button>
          <button type="button" class="btn btn-danger btn-sm" data-reject="${esc(m.name)}">거절</button>
        </div>
      </div>
    `).join('') : '<div class="empty-state">대기 중인 가입 신청이 없습니다.</div>';
    box.querySelectorAll('[data-approve]').forEach(btn=>btn.addEventListener('click', async ()=>{
      try{ await callApi('approveMember', Object.assign({targetName:btn.dataset.approve}, getAuthParams())); openPendingModal(); refreshHeader(); showToast('승인되었습니다.'); }
      catch(err){ showToast(err.message, true); }
    }));
    box.querySelectorAll('[data-reject]').forEach(btn=>btn.addEventListener('click', async ()=>{
      if(!confirm('가입 신청을 거절하시겠습니까?')) return;
      try{ await callApi('rejectMember', Object.assign({targetName:btn.dataset.reject}, getAuthParams())); openPendingModal(); refreshHeader(); }
      catch(err){ showToast(err.message, true); }
    }));
  }catch(err){ box.innerHTML = errorHtml(err.message); }
}

// ===== 인앱 브라우저 감지 =====
function detectInAppBrowser(){
  const ua = navigator.userAgent || '';
  return /KAKAOTALK|NAVER|Instagram|FBAN|FBAV|Line\//i.test(ua);
}
function openInExternalBrowser(){
  const url = window.location.href;
  const ua = navigator.userAgent || '';
  if(/KAKAOTALK/i.test(ua)) window.location.href = 'kakaotalk://web/openExternal?url='+encodeURIComponent(url);
  else if(/NAVER/i.test(ua)) window.location.href = 'naversearchapp://inappbrowser?app=naversearchapp&url='+encodeURIComponent(url);
  else window.location.href = 'intent://'+url.replace(/^https?:\/\//,'')+'#Intent;scheme=https;package=com.android.chrome;end';
}
function checkInApp(){
  if(detectInAppBrowser()){
    document.getElementById('inappBanner').classList.remove('hidden');
    document.getElementById('inappOpenBtn').addEventListener('click', openInExternalBrowser);
  }
}

// ===== 별 배경 =====
function initStars(){
  const layer = document.getElementById('starLayer');
  const frag = document.createDocumentFragment();
  for(let i=0;i<120;i++){
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random()*100+'%';
    s.style.top = Math.random()*100+'%';
    const size = Math.random()*2+1;
    s.style.width = size+'px';
    s.style.height = size+'px';
    s.style.animationDelay = (Math.random()*5)+'s';
    s.style.animationDuration = (2+Math.random()*3)+'s';
    frag.appendChild(s);
  }
  layer.appendChild(frag);
}

function updateSignupCohortVisibility(){
  const grade = document.getElementById('signupGrade').value;
  const show = grade==='재학생' || grade==='졸업생';
  document.getElementById('signupCohortLabel').classList.toggle('hidden', !show);
}
document.getElementById('signupGrade').addEventListener('change', updateSignupCohortVisibility);
updateSignupCohortVisibility();

document.getElementById('signupForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const name = document.getElementById('signupName').value.trim();
  const dept = document.getElementById('signupDept').value.trim();
  const grade = document.getElementById('signupGrade').value;
  const pw = document.getElementById('signupPw').value;
  const pw2 = document.getElementById('signupPw2').value;
  if(pw!==pw2){ showToast('비밀번호가 일치하지 않습니다.', true); return; }
  let cohort = '';
  if(grade==='재학생' || grade==='졸업생'){
    cohort = document.getElementById('signupCohort').value.trim();
    const num = Number(cohort);
    if(!cohort || !isFinite(num) || num<0){ showToast('기수는 0 이상의 숫자로 입력해주세요.', true); return; }
  }
  try{
    await callApi('signup', {name, dept, grade, cohort, pw});
    closeModal('signupModal');
    e.target.reset();
    updateSignupCohortVisibility();
    showToast('가입 신청이 완료되었습니다. 관리자 승인을 기다려주세요.');
  }catch(err){ showToast(err.message, true); }
});

    const res = await callApi('adminCheck', {adminPw:pw});
    if(!res.ok) throw new Error('비밀번호가 올바르지 않습니다.');

    closeModal('adminModal');
    e.target.reset();

    router();
    showToast('관리자 모드로 전환되었습니다.');
  }catch(err){ showToast(err.message, true); }
});

document.getElementById('photoForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const submitBtn = e.target.querySelector('button[type=submit]');
  submitBtn.disabled = true;
  try{
    const params = Object.assign({
      title: document.getElementById('photoTitle').value.trim(),
      category: document.getElementById('photoCategory').value,
      shotAt: document.getElementById('photoShotAt').value.trim(),
      location: document.getElementById('photoLocation').value.trim(),
      lat: document.getElementById('photoLat').value,
      lng: document.getElementById('photoLng').value,
      equipment: document.getElementById('photoEquipment').value.trim(),
      desc: document.getElementById('photoDesc').value.trim()
    }, getAuthParams());
    let res;
    if(editingPhotoId){
      params.id = editingPhotoId;
      res = await callApi('updatePhoto', params);
      res.id = editingPhotoId;
    } else {
      const file = document.getElementById('photoFile').files[0];
      if(!file) throw new Error('사진 파일을 선택해주세요.');
      showToast('이미지 업로드 중...');
      params.imageData = await resizeImage(file, 1600, 0.85);
      params.fileName = file.name;
      res = await callApi('uploadPhoto', params);
    }
    closeModal('photoModal');
    hideToast();
    location.hash = '#/photo/'+res.id;
    renderPhotoDetail(document.getElementById('app'), res.id);
  }catch(err){
    showToast('저장 실패: '+err.message, true);
  }finally{
    submitBtn.disabled = false;
  }
});
