<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0405">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<meta name="robots" content="noindex">
<title>관리자 메뉴 · 2026 광수중 주민 천체관측회</title>
<link rel="stylesheet" href="css/site.css?v=20261016a">
<link rel="stylesheet" href="css/objects.css?v=20261016a">
<style>
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--bg-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px; text-align: center; }
.stat .v { font-size: 1.4rem; font-weight: 800; color: var(--text-strong); }
.stat .l { font-size: .74rem; color: var(--muted); }
table.t { width: 100%; border-collapse: collapse; font-size: .88rem; }
table.t th, table.t td { padding: 6px; border-bottom: 1px solid var(--line); text-align: left; }
table.t th { color: var(--muted); font-weight: 500; font-size: .76rem; }
table.t td.n { text-align: right; }
.row2 { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
.todo a { color: var(--text-strong); }
</style>
</head>
<body>
<main class="wrap" id="app"><div class="loading">불러오는 중…</div></main>

<script src="js/core.js?v=20261016a"></script>
<script src="js/catalog.js?v=20261016a"></script>
<script>
(function () {
  'use strict';
  var esc = CN.esc, app = document.getElementById('app');
  CN.topbar();
  if (!CN.isAdmin()) {
    app.innerHTML = '<h1>관리자 메뉴</h1><p class="sub">관리자 로그인이 필요해요.</p><button class="btn primary" id="lg">관리자 로그인</button>';
    document.getElementById('lg').onclick = CN.openLogin;
    return;
  }
  var a = CN.admin();

  app.innerHTML =
    '<h1>관리자 메뉴</h1><p class="sub">' + esc(a.who.label) + ' 님으로 로그인했어요.</p>' +
    '<section class="card" id="reg"><h2 style="margin-top:0">사전신청 현황</h2><div class="loading">불러오는 중…</div></section>' +
    '<section class="card" id="cfg"><h2 style="margin-top:0">행사 설정</h2><div class="loading">불러오는 중…</div></section>' +
    '<section class="card" id="prog"><h2 style="margin-top:0">천체 설명 작성 현황</h2><div class="loading">불러오는 중…</div></section>' +
    '<section class="card"><h2 style="margin-top:0">백업</h2><p class="hint">천체 편집 내용·안내 페이지·설정을 JSON 파일로 내려받아요. (신청자 명단은 포함되지 않아요 — 구글 시트에 있어요)</p><button class="btn small" id="bk">편집 내용 내려받기</button></section>';
  CN.footer({});

  // ----- 사전신청 -----
  async function loadReg() {
    var el = document.getElementById('reg');
    try {
      var c = await CN.api('counts', {}, 20000);
      if (!c || !c.ok) throw new Error(c && c.error ? c.error : '집계를 불러오지 못했어요.');
      var rows = function (obj) { return Object.keys(obj).map(function (k) { return '<tr><td>' + esc(k) + '</td><td class="n">' + obj[k].forms + '건</td><td class="n">' + obj[k].people + '명' + (obj[k].remaining != null ? ' <span class="hint-inline">(남은 ' + obj[k].remaining + ')</span>' : '') + '</td></tr>'; }).join(''); };
      el.innerHTML = '<h2 style="margin-top:0">사전신청 현황</h2>' +
        '<div class="stats"><div class="stat"><div class="v">' + c.total.forms + '</div><div class="l">신청 건수</div></div><div class="stat"><div class="v">' + c.total.people + '</div><div class="l">예상 인원</div></div><div class="stat"><div class="v">' + (c.regOpen ? '받는 중' : '마감') + '</div><div class="l">신청 상태</div></div></div>' +
        '<h3 style="margin-top:14px">시간대별</h3><table class="t"><tr><th>시간대</th><th class="n">건수</th><th class="n">인원</th></tr>' + rows(c.slots) + '</table>' +
        '<h3 style="margin-top:14px">신분별</h3><table class="t"><tr><th>신분</th><th class="n">건수</th><th class="n">인원</th></tr>' + rows(c.roles) + '</table>' +
        '<div class="row2"><button class="btn small" id="toggleReg">' + (c.regOpen ? '사전신청 마감하기' : '사전신청 다시 열기') + '</button><button class="btn small ghost" id="links">신청 명단(구글 시트) 열기</button><a class="btn small ghost" href="status.html">공개 현황 페이지</a></div>' +
        (c.capacity ? '<h3 style="margin-top:16px">첫 타임(' + esc(c.firstSlot) + ') 학생 신청</h3><p class="hint" style="margin-top:0">첫 타임은 주민 우선이라 학생 신청을 막아 두었어요. 자리가 남으면 열어 주세요. 정원은 시간대마다 ' + c.capacity + '명이에요.</p>' +
          '<div class="row2" style="margin-top:4px"><strong>' + (c.studentFirstOpen ? '지금: 학생도 신청 가능' : '지금: 학생 신청 막힘') + '</strong><button class="btn small" id="toggleStudent">' + (c.studentFirstOpen ? '학생 신청 다시 막기' : '학생에게도 열기') + '</button></div>' : '') +
        '<p class="hint">명단(이름·학번 등)은 사이트에 띄우지 않고 구글 시트에서만 볼 수 있어요. 시트는 소유자 계정으로 로그인해야 열려요. 집계는 1분마다 갱신돼요.</p>';
      document.getElementById('toggleReg').onclick = async function () {
        if (!confirm(c.regOpen ? '사전신청을 마감할까요?' : '사전신청을 다시 열까요?')) return;
        try { var r = await CN.api('setRegOpen', { pw: a.pw, open: c.regOpen ? 'N' : 'Y' }); if (!r.ok) throw new Error(r.error); loadReg(); } catch (e) { CN.toast(e.message); }
      };
      var ts = document.getElementById('toggleStudent');
      if (ts) ts.onclick = async function () {
        if (!confirm(c.studentFirstOpen ? '첫 타임 학생 신청을 다시 막을까요? (이미 신청한 학생은 그대로예요)' : '첫 타임(' + c.firstSlot + ')을 학생에게도 열까요?')) return;
        try { var r = await CN.api('setStudentFirst', { pw: a.pw, open: c.studentFirstOpen ? 'N' : 'Y' }); if (!r.ok) throw new Error(r.error); CN.toast('바꿨어요'); loadReg(); } catch (e) { CN.toast(e.message); }
      };
      document.getElementById('links').onclick = async function () {
        try { var r = await CN.api('links', { pw: a.pw }); if (!r.ok) throw new Error(r.error); window.open(r.sheetUrl, '_blank', 'noopener'); } catch (e) { CN.toast(e.message, 4000); }
      };
    } catch (e) { el.innerHTML = '<h2 style="margin-top:0">사전신청 현황</h2><div class="msg err show">' + esc(e.message) + '</div>'; }
  }

  // ----- 행사 설정 -----
  async function loadCfg() {
    var cfg = await CN.getConfig();
    var el = document.getElementById('cfg');
    el.innerHTML = '<h2 style="margin-top:0">행사 설정</h2>' +
      '<label class="field" for="ed">행사 날짜 (미리보기 계산 기준)</label><input type="date" id="ed" value="' + esc(cfg.eventDate) + '" style="max-width:220px">' +
      '<div class="hint">비 때문에 연기되면 여기 날짜만 바꾸세요. 시간대별 미리보기·천체 페이지의 위치와 날짜 문구가 모두 새 날짜로 바뀌어요. 메인 화면 공지와 「행사 안내」의 일시도 함께 고쳐 주세요.</div>' +
      '<div class="row2"><button class="btn small primary" id="saveDate">날짜 저장</button><a class="btn small ghost" href="index.html">공지·행사 안내 고치기 (메인 화면)</a></div>' +
      '<p class="hint" style="margin-top:12px">미리보기 시각: ' + esc(cfg.previewTimes.join(' / ')) + ' · 신청 시간대: ' + esc(cfg.slots.join(' / ')) + ' (코드에 고정)</p>';
    document.getElementById('saveDate').onclick = async function () {
      var v = document.getElementById('ed').value;
      if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) return CN.toast('날짜를 확인해 주세요');
      if (!confirm(CN.dateLabel(v) + '로 바꿀까요?')) return;
      try { await CN.db.patch(CN.path('config'), { eventDate: v, by: a.who.label, at: Date.now() }); CN.toast('저장했어요'); } catch (e) { CN.toast(e.message); }
    };
  }

  // ----- 작성 현황 -----
  async function loadProg() {
    var st = await CN.loadAll();
    var el = document.getElementById('prog');
    var score = function (id) { return CN.progressOf(st, id); };
    var feat = st.list.filter(function (o) { return CN.isFeatured(st, o); });
    var full = st.list.filter(function (o) { return score(o.id) >= 4; }).length;
    var any = st.list.filter(function (o) { return score(o.id) > 0; }).length;
    var recent = [];
    Object.keys(st.content).forEach(function (id) {
      var c = st.content[id];
      var add = function (sec, r) { if (r && r.at) recent.push({ id: id, sec: sec, by: r.by, author: CN.authorOf(r), at: r.at }); };
      ['points', 'description', 'story'].forEach(function (k) { add(CN.SECTIONS[k], c[k]); });
      Object.values(c.photos || {}).forEach(function (p) { add('사진', p); });
      Object.values(c.hopping || {}).forEach(function (p) { if ((p.text || '').trim() || p.fileId || p.chart) add('호핑법', p); });
      add('난이도·추천', c.meta);
      add('기본 정보', c.basic);
    });
    recent.sort(function (x, y) { return y.at - x.at; });
    // 사람별: 처음 쓴 항목 수(작성) / 마지막으로 고친 항목 수(편집)
    var byWho = {};
    var bump = function (name, f) { if (!name) return; name = name.replace(/ \(되돌림\)$/, ''); byWho[name] = byWho[name] || { w: 0, e: 0 }; byWho[name][f]++; };
    recent.forEach(function (r) { bump(r.author, 'w'); if (r.by && r.by !== r.author) bump(r.by, 'e'); });
    el.innerHTML = '<h2 style="margin-top:0">천체 설명 작성 현황</h2>' +
      '<div class="stats"><div class="stat"><div class="v">' + st.list.length + '</div><div class="l">전체 천체</div></div><div class="stat"><div class="v">' + any + '</div><div class="l">하나라도 작성</div></div><div class="stat"><div class="v">' + full + '</div><div class="l">4개 항목 완성</div></div></div>' +
      '<h3 style="margin-top:14px">★ 관측회 추천 천체 (' + feat.length + '개)</h3><table class="t todo"><tr><th>천체</th><th class="n">작성</th></tr>' +
      feat.map(function (o) { var s = score(o.id); return '<tr><td><a href="objects.html?id=' + encodeURIComponent(o.id) + '">' + esc(o.nameKo) + '</a></td><td class="n">' + s + '/4</td></tr>'; }).join('') + '</table>' +
      '<p class="hint">작성 4항목 = 관측포인트 · 설명 · 호핑법 · 사진</p>' +
      '<h3 style="margin-top:14px">작성·편집한 사람</h3>' + (Object.keys(byWho).length ? '<table class="t"><tr><th>이름</th><th class="n">작성</th><th class="n">편집</th></tr>' + Object.keys(byWho).sort(function (x, y) { return (byWho[y].w + byWho[y].e) - (byWho[x].w + byWho[x].e); }).map(function (k) { return '<tr><td>' + esc(k) + '</td><td class="n">' + byWho[k].w + '</td><td class="n">' + byWho[k].e + '</td></tr>'; }).join('') + '</table><p class="hint">작성 = 처음 쓴 항목 수, 편집 = 다른 사람이 쓴 것을 마지막으로 고친 항목 수</p>' : '<p class="empty-sec">아직 없어요.</p>') +
      '<h3 style="margin-top:14px">최근 편집</h3>' + (recent.length ? '<table class="t"><tr><th>천체</th><th>항목</th><th>작성</th><th>마지막 편집</th></tr>' + recent.slice(0, 30).map(function (r) { var o = st.byId[r.id]; return '<tr><td><a href="objects.html?id=' + encodeURIComponent(r.id) + '">' + esc(o ? o.nameKo : r.id) + '</a></td><td>' + esc(r.sec) + '</td><td>' + esc(r.author || '') + '</td><td>' + (r.by && r.by !== r.author ? esc(r.by) + ' · ' : '') + CN.fmtWhen(r.at) + '</td></tr>'; }).join('') + '</table>' : '<p class="empty-sec">아직 없어요.</p>');
  }

  document.getElementById('bk').onclick = async function () {
    try {
      var all = await CN.db.get(CN.ROOT);
      var blob = new Blob([JSON.stringify(all, null, 2)], { type: 'application/json' });
      var u = URL.createObjectURL(blob), l = document.createElement('a');
      l.href = u; l.download = 'cosmosNight-backup-' + new Date().toISOString().slice(0, 10) + '.json'; l.click();
      setTimeout(function () { URL.revokeObjectURL(u); }, 2000);
    } catch (e) { CN.toast(e.message); }
  };

  loadReg(); loadCfg(); loadProg();
})();
</script>
</body>
</html>
