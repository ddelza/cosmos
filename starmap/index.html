<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<link rel="icon" href="../2026/img/favicon.svg" type="image/svg+xml">
<title>3D 우리은하 성도 · 광수중 천체관측동아리 코스모스</title>
<meta name="description" content="지구에서 올려다본 밤하늘에서 출발해 우리은하 밖까지 — 별·성단·성운·은하가 실제로 어디에 있는지 3차원으로 보는 성도.">
<meta property="og:title" content="3D 우리은하 성도 · 코스모스">
<meta property="og:description" content="밤하늘의 천체들은 우리은하 어디쯤에 있을까? 지구에서 본 하늘 ↔ 은하에서 본 모습">
<meta property="og:type" content="website">
<link rel="stylesheet" href="../2026/css/site.css?v=20261102a">
<link rel="stylesheet" href="../2026/css/objects.css?v=20261102a">
<style>
html, body { height: 100%; overflow: hidden; background: #000; overscroll-behavior: none; }
body { background: #000; }
#gl, #ov { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#ov { touch-action: none; cursor: grab; }
#ov.drag { cursor: grabbing; }
#ov.measure { cursor: crosshair; }
.sm-ui { position: fixed; z-index: 20; font-size: 13px; color: #cfd6e6; user-select: none; -webkit-user-select: none; }
.sm-ui button, .swin button { font-family: inherit; }
:root { --glass: rgba(16,19,28,.78); --edge: #2c3448; --hi: #8fb0ff; --dim: #8b97b3; }

/* 왼쪽 위: 고른 천체 정보 (Stellarium처럼 글자 위주) */
#info { top: 10px; left: 12px; padding: 6px 10px; border-radius: 10px; background: rgba(0,0,0,.45); width: min(370px, calc(100vw - 190px)); text-shadow: 0 0 4px #000, 0 0 2px #000; line-height: 1.5; pointer-events: none; }
#info h2 { margin: 0; font-size: 1.25rem; color: #fff; line-height: 1.3; pointer-events: auto; cursor: pointer; }
#info h2::after { content: ' ▾'; font-size: .7em; color: var(--dim); }
#info.min h2::after { content: ' ▸'; }
#info.min dl, #info.min .im { display: none; }
#info .sub { color: #9fb0d0; font-size: .86rem; }
#info dl { margin: 6px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 0 10px; font-size: .84rem; }
#info dt { color: var(--dim); white-space: nowrap; }
#info dd { margin: 0; color: #e6ebf5; }
#info .acts { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; pointer-events: auto; }
#info .tip { color: var(--dim); font-size: .8rem; }
#info .im { width: 72px; height: 72px; border-radius: 8px; overflow: hidden; float: right; margin: 0 0 6px 10px; background: #050505; pointer-events: auto; }
#info .im img, #info .im .thumb { width: 100%; height: 100%; object-fit: cover; display: block; }

.sbtn { background: rgba(20,24,34,.82); border: 1px solid #39425a; color: #cfd6e6; border-radius: 8px; padding: 6px 10px; font-size: .82rem; cursor: pointer; white-space: nowrap; line-height: 1.2; }
.sbtn:hover { border-color: #7f93c8; }
.sbtn.on { background: rgba(60,84,150,.85); border-color: #9db4f0; color: #fff; }
.sbtn.big { padding: 9px 14px; font-size: .92rem; font-weight: 700; }
.sbtn.go { background: rgba(120,60,20,.9); border-color: #e8a45a; color: #ffe9cf; }
.sbtn kbd { font-family: inherit; font-size: .68rem; color: var(--dim); margin-left: 4px; }

/* 오른쪽 위 */
#top { top: 10px; right: 12px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
#top a.home { color: #9fb0d0; font-size: .78rem; text-decoration: none; text-shadow: 0 0 4px #000; }

/* Stellarium식 막대: 왼쪽 세로(창 열기) + 아래 가로(표시 켜고 끄기·시간) */
.ib { flex: none; width: 38px; height: 38px; display: inline-flex; align-items: center; justify-content: center; border-radius: 9px; border: 1px solid transparent; background: none; color: #7f8aa6; cursor: pointer; padding: 0; transition: color .12s, background .12s, box-shadow .12s; }
.ib svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
.ib svg .f { fill: currentColor; stroke: none; }
.ib svg text { fill: currentColor; stroke: none; font-weight: 700; font-family: inherit; }
.ib:hover { color: #e6ebf5; background: rgba(120,140,200,.16); }
.ib.on { color: #dfe8ff; background: rgba(90,120,220,.28); border-color: rgba(143,176,255,.55); box-shadow: 0 0 10px rgba(110,150,255,.35) inset; }
#lbar { left: 8px; bottom: 84px; display: flex; flex-direction: column; gap: 2px; padding: 5px; border-radius: 13px; background: var(--glass); border: 1px solid var(--edge); backdrop-filter: blur(8px); transition: transform .25s; }
#bar { left: 8px; right: 8px; bottom: 6px; padding: 4px 8px 3px; border-radius: 13px; background: var(--glass); border: 1px solid var(--edge); backdrop-filter: blur(8px); transition: transform .25s; }
#bar .line { display: flex; gap: 2px; align-items: center; overflow-x: auto; scrollbar-width: none; }
#bar .line::-webkit-scrollbar { display: none; }
#bar .sep { flex: none; width: 1px; height: 22px; background: var(--edge); margin: 0 5px; }
#bar .lbl { flex: none; color: var(--dim); font-size: .76rem; margin: 0 2px; }
#bar .grow { flex: 1; min-width: 6px; }
#bar .sbtn { padding: 5px 9px; flex: none; }
#status { display: flex; gap: 14px; align-items: center; font-size: .78rem; color: #aab5cf; padding: 3px 4px 1px; border-top: 1px solid rgba(60,70,95,.5); margin-top: 3px; white-space: nowrap; overflow-x: auto; scrollbar-width: none; }
#status::-webkit-scrollbar { display: none; }
#status button { background: none; border: 0; color: inherit; font: inherit; cursor: pointer; padding: 0; }
#status button:hover { color: #fff; }
#status .grow { flex: 1; }
#status .clock { color: #fff; font-variant-numeric: tabular-nums; }
body.autohide #lbar { transform: translateX(calc(-100% + 6px)); }
body.autohide #lbar:hover, body.autohide #lbar:focus-within { transform: none; }
body.autohide #bar { transform: translateY(calc(100% - 26px)); }
body.autohide #bar:hover, body.autohide #bar:focus-within { transform: none; }
body.nogui .sm-ui:not(#guiBack), body.nogui .swin { display: none !important; }
#guiBack { display: none; left: 8px; bottom: 8px; }
body.nogui #guiBack { display: block; opacity: .35; }
#tipbox { position: fixed; z-index: 120; pointer-events: none; background: #0b0e16; border: 1px solid #3b4666; color: #e6ebf5; font-size: 12px; padding: 4px 8px; border-radius: 7px; white-space: nowrap; display: none; }
#tipbox kbd { font-family: inherit; color: var(--hi); margin-left: 6px; }
#nightmask { position: fixed; inset: 0; z-index: 1000; pointer-events: none; background: #f00; mix-blend-mode: multiply; display: none; }
body.night #nightmask { display: block; }

#caption { left: 50%; transform: translateX(-50%); top: 14px; text-align: center; color: #e6ebf5; text-shadow: 0 0 6px #000, 0 0 3px #000; font-size: .95rem; pointer-events: none; max-width: calc(100vw - 800px); min-width: 240px; transition: opacity .6s; }
#loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #9fb0d0; z-index: 30; background: #000; }

/* 떠 있는 창 (끌어서 옮기기) */
.swin { position: fixed; z-index: 40; width: min(430px, calc(100vw - 16px)); max-height: min(76vh, 640px); display: flex; flex-direction: column; background: rgba(14,17,26,.93); border: 1px solid #36405a; border-radius: 14px; box-shadow: 0 12px 40px rgba(0,0,0,.6); backdrop-filter: blur(10px); color: #d5dcec; font-size: 13.5px; line-height: 1.5; }
.swin.wide { width: min(600px, calc(100vw - 16px)); }
.swin .hd { display: flex; align-items: center; gap: 8px; padding: 9px 10px 9px 14px; cursor: move; border-bottom: 1px solid #262e42; touch-action: none; user-select: none; -webkit-user-select: none; }
.swin .hd b { flex: 1; color: #fff; font-size: .95rem; }
.swin .hd kbd { font-family: inherit; font-size: .72rem; color: var(--hi); border: 1px solid #36405a; border-radius: 5px; padding: 0 5px; }
.swin .hd button { background: none; border: 0; color: var(--dim); font-size: 1rem; cursor: pointer; padding: 2px 6px; border-radius: 6px; }
.swin .hd button:hover { color: #fff; background: rgba(255,255,255,.1); }
.swin .tabs { display: flex; gap: 2px; padding: 6px 8px 0; border-bottom: 1px solid #262e42; overflow-x: auto; scrollbar-width: none; }
.swin .tabs button { background: none; border: 0; border-bottom: 2px solid transparent; color: var(--dim); padding: 6px 10px; cursor: pointer; font-size: .86rem; white-space: nowrap; }
.swin .tabs button.on { color: #fff; border-bottom-color: var(--hi); }
.swin .bd { padding: 12px 14px 14px; overflow: auto; }
.swin h4 { margin: 12px 0 4px; font-size: .78rem; color: var(--hi); font-weight: 700; letter-spacing: .02em; }
.swin h4:first-child { margin-top: 0; }
.swin p { margin: 0 0 8px; }
.swin .hint { color: var(--dim); font-size: .8rem; }
.swin label.row { display: flex; align-items: center; gap: 8px; padding: 3px 0; cursor: pointer; }
.swin label.row kbd, .keys kbd { font-family: inherit; font-size: .72rem; color: var(--hi); border: 1px solid #36405a; border-radius: 5px; padding: 0 5px; margin-left: auto; white-space: nowrap; }
.swin input[type=checkbox], .swin input[type=radio] { -webkit-appearance: auto; appearance: auto; width: 16px; height: 16px; margin: 0; accent-color: #6f95ff; background: none; border: 0; flex: none; }
.swin input[type=checkbox]::after { content: none !important; }
.swin .sl { display: grid; grid-template-columns: 96px 1fr 52px; gap: 8px; align-items: center; padding: 3px 0; }
.swin .sl input[type=range] { width: 100%; accent-color: #6f95ff; }
.swin .sl output { text-align: right; color: #fff; font-variant-numeric: tabular-nums; font-size: .82rem; }
.swin select, .swin input[type=text], .swin input[type=number], .swin input[type=search], .swin input[type=datetime-local] { width: 100%; padding: 7px 9px; border-radius: 8px; border: 1px solid #36405a; background: #0a0d15; color: #fff; font-size: .9rem; font-family: inherit; color-scheme: dark; -webkit-appearance: auto; appearance: auto; }
.swin .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
.swin .btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.swin .list { display: grid; gap: 2px; max-height: 46vh; overflow: auto; }
.swin .list button { display: flex; gap: 8px; align-items: baseline; text-align: left; background: none; border: 0; border-radius: 7px; color: #dfe5f2; padding: 6px 8px; font-size: .86rem; cursor: pointer; }
.swin .list button small { color: var(--dim); }
.swin .list button:hover { background: #1b2540; }
.swin table { width: 100%; border-collapse: collapse; font-size: .82rem; }
.swin th { text-align: left; color: var(--dim); font-weight: 400; padding: 3px 6px; position: sticky; top: 0; background: #0e111a; }
.swin td { padding: 3px 6px; border-top: 1px solid #1c2233; white-space: nowrap; }
.swin tr[data-id] { cursor: pointer; }
.swin tr[data-id]:hover td { background: #1b2540; }
.swin td.num { text-align: right; font-variant-numeric: tabular-nums; }
.spin { display: flex; justify-content: center; align-items: center; gap: 4px; margin: 4px 0 10px; }
.spin .u { display: flex; flex-direction: column; align-items: center; }
.spin .u button { background: none; border: 0; color: var(--dim); cursor: pointer; font-size: .8rem; padding: 2px 10px; border-radius: 6px; }
.spin .u button:hover { color: #fff; background: rgba(255,255,255,.1); }
.spin .u span { font-size: 1.5rem; color: #fff; font-variant-numeric: tabular-nums; min-width: 1.4em; text-align: center; }
.spin .u.y span { min-width: 2.6em; }
.spin i { font-style: normal; color: var(--dim); font-size: 1.2rem; padding: 0 1px; }
.smap { height: 280px; border-radius: 10px; overflow: hidden; border: 1px solid #36405a; background: #0a0d15; margin-top: 4px; }
.smap .leaflet-tile-pane { filter: invert(1) hue-rotate(185deg) brightness(.92) contrast(.9) saturate(.6); }
.leaflet-container img { max-width: none !important; filter: none; }
.leaflet-container { font-family: inherit; }
.leaflet-container .leaflet-control-attribution { background: rgba(10,13,21,.75); color: #8b97b3; font-size: 10px; }
.leaflet-container .leaflet-control-attribution a { color: #8fb0ff; }
.leaflet-bar a { background: #141a28; color: #dfe5f2; border-color: #36405a; }
.leaflet-bar a:hover { background: #1f2840; }
.keys { display: grid; grid-template-columns: 1fr auto; gap: 3px 12px; font-size: .84rem; }
.keys kbd { margin: 0; }
.keys .no { color: var(--dim); }
@media (max-width: 640px) {
  #info { width: auto; max-width: calc(100vw - 24px); top: 64px; font-size: 12px; }
  #info .im { width: 54px; height: 54px; }
  #caption { top: auto; bottom: 150px; max-width: 80vw; font-size: .85rem; }
  #lbar { bottom: 90px; }
  .ib { width: 36px; height: 36px; }
  .swin { left: 8px !important; right: 8px; top: 56px !important; width: auto; max-height: 62vh; }
}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="ov"></canvas>
<div id="loading">별 2만 6천 개를 불러오는 중…</div>

<div id="info" class="sm-ui no-emo"></div>

<div id="top" class="sm-ui no-emo">
  <button class="sbtn big go" id="bMode"></button>
  <a class="home" href="../nightly.html">밤하늘 관측 도우미 ›</a>
</div>

<div id="caption" class="sm-ui no-emo"></div>

<div id="lbar" class="sm-ui no-emo"></div>
<div id="bar" class="sm-ui no-emo">
  <div class="line" id="tools"></div>
  <div id="status"></div>
</div>
<button id="guiBack" class="sm-ui sbtn no-emo" title="화면 요소 다시 보이기 (Ctrl+T)">화면 요소 보이기</button>
<div id="tipbox" class="no-emo"></div>
<div id="nightmask"></div>

<script>window.CN_BASE = '../2026/'; window.CN_FEATURED_MODE = 'nightly';</script>
<script src="../2026/js/core.js?v=20261102a"></script>

<script src="../2026/js/astro.js?v=20261102a"></script>
<script src="../2026/js/catalog.js?v=20261102a"></script>
<script src="../2026/js/starchart.js?v=20261102a"></script>
<script src="../2026/js/object-view.js?v=20261102a"></script>
<script src="app.js?v=20261118e"></script>
</body>
