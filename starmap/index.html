<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<link rel="icon" href="../2026/img/favicon.svg" type="image/svg+xml">
<title>3D 우리은하 성도 · 광수중 천체관측동아리 코스모스</title>
<meta name="description" content="지구에서 올려다본 밤하늘에서 출발해 우리은하 밖까지 — 별·성단·성운·은하가 실제로 어디에 있는지 3차원으로 보는 성도.">
<meta property="og:title" content="3D 우리은하 성도 · 코스모스">
<meta property="og:description" content="밤하늘의 천체들은 우리은하 어디쯤에 있을까? 지구에서 본 하늘 ↔ 은하에서 본 모습">

<style>
html, body { height: 100%; overflow: hidden; background: #000; overscroll-behavior: none; }
body { background: #000; }
#gl, #ov { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#ov { touch-action: none; cursor: grab; }
#ov.drag { cursor: grabbing; }
.sm-ui { position: fixed; z-index: 20; font-size: 13px; color: #cfd6e6; --c: #cfd6e6; user-select: none; -webkit-user-select: none; }
.sm-ui button { font-family: inherit; }

/* 왼쪽 위: 고른 천체 정보 (Stellarium처럼 글자만) */
#info { top: 10px; left: 12px; padding: 6px 10px; border-radius: 10px; background: rgba(0,0,0,.5); width: min(370px, calc(100vw - 150px)); text-shadow: 0 0 4px #000, 0 0 2px #000; line-height: 1.5; pointer-events: none; }
#info h2 { margin: 0; font-size: 1.25rem; color: #fff; line-height: 1.3; pointer-events: auto; cursor: pointer; }
#info h2::after { content: ' ▾'; font-size: .7em; color: #8b97b3; }
#info.min h2::after { content: ' ▸'; }
#info.min dl, #info.min .im { display: none; }
#info .sub { color: #9fb0d0; font-size: .86rem; }
#info dl { margin: 6px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 0 10px; font-size: .84rem; }
#info dt { color: #8b97b3; white-space: nowrap; }
#info dd { margin: 0; color: #e6ebf5; }
#info .acts { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; pointer-events: auto; }
#info .tip { color: #8b97b3; font-size: .8rem; }
#info .im { width: 72px; height: 72px; border-radius: 8px; overflow: hidden; float: right; margin: 0 0 6px 10px; background: #050505; pointer-events: auto; }
#info .im img, #info .im .thumb { width: 100%; height: 100%; object-fit: cover; display: block; }

.sbtn { background: rgba(20,24,34,.82); border: 1px solid #39425a; color: #cfd6e6; border-radius: 8px; padding: 6px 10px; font-size: .82rem; cursor: pointer; white-space: nowrap; line-height: 1.2; }
.sbtn:hover { border-color: #7f93c8; }
.sbtn.on { background: rgba(60,84,150,.85); border-color: #9db4f0; color: #fff; }
.sbtn.big { padding: 9px 14px; font-size: .92rem; font-weight: 700; }
.sbtn.go { background: rgba(120,60,20,.9); border-color: #e8a45a; color: #ffe9cf; }
.sbtn kbd { font-family: inherit; font-size: .68rem; color: #8b97b3; margin-left: 4px; }
.sbtn.on kbd { color: #c9d6ff; }

/* 오른쪽 위 */
#top { top: 10px; right: 12px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
#top .row { display: flex; gap: 6px; }
#top a.home { color: #9fb0d0; font-size: .78rem; text-decoration: none; text-shadow: 0 0 4px #000; }
#searchBox { position: relative; }
#searchBox input { width: 190px; padding: 7px 10px; border-radius: 8px; border: 1px solid #39425a; background: rgba(10,12,18,.92); color: #fff; font-size: .9rem; font-family: inherit; }
#searchRes { position: absolute; right: 0; top: 100%; margin-top: 4px; width: 260px; max-height: 50vh; overflow: auto; background: rgba(10,12,18,.97); border: 1px solid #39425a; border-radius: 8px; display: none; }
#searchRes button { display: block; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid #1d2333; color: #dfe5f2; padding: 8px 10px; font-size: .86rem; cursor: pointer; }
#searchRes button small { color: #8b97b3; margin-left: 6px; }
#searchRes button:hover, #searchRes button.cur { background: #1b2540; }

/* 아래: 도구 막대 */
#bar { left: 0; right: 0; bottom: 0; padding: 6px 10px calc(6px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, rgba(0,0,0,.78) 30%); }
#bar .line { display: flex; gap: 5px; align-items: center; overflow-x: auto; scrollbar-width: none; padding: 3px 0; }
#bar .line::-webkit-scrollbar { display: none; }
#bar .sep { flex: none; width: 1px; height: 20px; background: #39425a; margin: 0 3px; }
#bar .lbl { flex: none; color: #8b97b3; font-size: .76rem; }
#status { display: flex; gap: 14px; align-items: center; font-size: .8rem; color: #aab5cf; padding: 2px 2px 0; white-space: nowrap; overflow-x: auto; scrollbar-width: none; }
#status::-webkit-scrollbar { display: none; }
#status button { background: none; border: 0; color: inherit; font: inherit; cursor: pointer; padding: 0; text-decoration: underline dotted; text-underline-offset: 3px; }
#status .grow { flex: 1; }
#status .clock { color: #fff; font-variant-numeric: tabular-nums; }
#caption { left: 50%; transform: translateX(-50%); top: 14px; text-align: center; color: #e6ebf5; text-shadow: 0 0 6px #000, 0 0 3px #000; font-size: .95rem; pointer-events: none; max-width: calc(100vw - 480px); transition: opacity .6s; }
#loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #9fb0d0; z-index: 30; background: #000; }
.help-keys { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: .9rem; }
.help-keys kbd { background: var(--surface-2); border: 1px solid var(--line); border-radius: 5px; padding: 0 6px; font-family: inherit; white-space: nowrap; }
.setgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.setgrid input { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg-2); color: var(--text-strong); font-size: 1rem; font-family: inherit; color-scheme: dark; }
@media (max-width: 640px) {
  #info { width: auto; max-width: calc(100vw - 24px); top: 92px; font-size: 12px; }
  #info .im { width: 54px; height: 54px; }
  #searchBox input { width: 130px; }
  .sbtn kbd { display: none; }
  #caption { top: auto; bottom: 132px; max-width: 92vw; font-size: .85rem; }
}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="ov"></canvas>
<div id="loading">별 2만 6천 개를 불러오는 중…</div>

<div id="info" class="sm-ui no-emo"></div>

<div id="top" class="sm-ui no-emo">
  <div class="row">
    <div id="searchBox"><input type="search" id="q" placeholder="천체 찾기 (M31, 직녀성…)" autocomplete="off"><div id="searchRes"></div></div>
    <button class="sbtn" id="bHelp" title="도움말 (F1)">?</button>
  </div>
  <button class="sbtn big go" id="bMode"></button>
  <a class="home" href="../nightly.html">밤하늘 관측 도우미 ›</a>
</div>

<div id="caption" class="sm-ui no-emo"></div>

<div id="bar" class="sm-ui no-emo">
  <div class="line" id="tools"></div>
  <div id="status"></div>
</div>

</html>
