<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>후드티 투표 현황</title>
<link rel="icon" href="../logo.png">
<link rel="stylesheet" href="hood.css">
</head>
<body>

<div class="wrap">
  <div class="header">
    <h1>📊 후드티 투표 현황</h1>
    <p>2026 코스모스 후드티 · <span id="updated">불러오는 중...</span></p>
  </div>

  <div class="who-banner">
    <span id="whoLabel">누구나 볼 수 있어요</span>
    <span class="links">
      <a href="index.html">✏️ 투표하러 가기</a>
      <button onclick="load()">새로고침</button>
    </span>
  </div>

  <div class="card" style="text-align:center">
    <div class="muted">참여 인원</div>
    <div class="stat-big" id="total">-</div>
  </div>

  <div class="card">
    <h2>뒷면 시안 <span class="muted">(복수 투표 · 참여 인원 대비 %)</span></h2>
    <div id="designBars"></div>
    <div id="designEtcList"></div>
  </div>

  <div class="card">
    <h2>색</h2>
    <div id="colorBars"></div>
    <div id="colorEtcList"></div>
  </div>

  <div class="card">
    <h2>사이즈</h2>
    <div id="sizeBars"></div>
    <div class="scroll-x" style="margin-top:12px"><table class="grid" id="crossTable"></table></div>
  </div>

  <div class="card">
    <h2>참여한 사람</h2>
    <p class="hint"><span style="color:var(--ok)">● 투표함</span> · <span style="color:var(--danger)">● 아직 안 함</span> — <span id="memberSummary"></span></p>
    <div class="chips" id="voterChips"></div>
  </div>

  <div class="card hidden" id="teacherCard">
    <h2>전체 응답 (교사용)</h2>
    <button class="btn" style="margin:6px 0 12px" onclick="downloadXlsx()">📥 엑셀로 다운로드</button>
    <div class="scroll-x"><table class="grid" id="detailTable"></table></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="hood.js"></script>
<script>
const viewer = getHoodUser();
const isTeacher = !!(viewer && viewer.isTeacher);
if (viewer) document.getElementById('whoLabel').textContent = `✓ ${whoLabel(viewer)}`;

function bars(rows, denom) {
  const max = Math.max(0, ...rows.map(r => r.n));
  return rows.map(r => {
    const pct = denom ? Math.round(r.n / denom * 100) : 0;
    const lead = max > 0 && r.n === max;
    return `<div class="bar-row${lead ? ' lead' : ''}">
      <div class="bar-top"><span class="lbl">${r.html}</span><span class="cnt">${r.n}표${denom ? ` · ${pct}%` : ''}</span></div>
      <div class="bar"><span style="width:${denom ? r.n / denom * 100 : 0}%"></span></div>
    </div>`;
  }).join('');
}

function suggestList(title, items) {
  if (!items.length) return '';
  return `<div class="muted" style="margin:12px 0 6px">${title} (${items.length})</div>` +
    items.map(t => `<div class="suggest">${esc(t)}</div>`).join('');
}

let lastList = [];

function render(votes) {
  const list = Object.entries(votes || {}).map(([id, v]) => ({ id, ...v })).sort((a, b) => a.id.localeCompare(b.id));
  lastList = list;
  const total = list.length;
  document.getElementById('total').textContent = `${total}명`;

  // 시안
  const designRows = DESIGNS.map(d => ({
    html: `<img class="thumb" src="img/p-${d.key}.png" alt="">${d.key}. ${esc(d.label)}`,
    n: list.filter(v => (v.designs || []).includes(d.key)).length,
  }));
  const designEtc = list.map(v => v.designEtc).filter(Boolean);
  designRows.push({ html: '8. 그외 제안', n: designEtc.length });
  document.getElementById('designBars').innerHTML = bars(designRows, total);
  document.getElementById('designEtcList').innerHTML = suggestList('그외 시안 제안', designEtc);

  // 색
  const colorRows = COLORS.map((c, i) => ({
    html: `${c.swatch ? `<span class="sw" style="display:inline-block;width:12px;height:12px;border-radius:50%;background:${c.swatch};border:1px solid rgba(255,255,255,.35);margin-right:6px"></span>` : ''}${i + 1}. ${esc(c.label)}`,
    n: list.filter(v => v.color === c.key).length,
  }));
  document.getElementById('colorBars').innerHTML = bars(colorRows, total);
  document.getElementById('colorEtcList').innerHTML = suggestList('그외 색 제안', list.filter(v => v.color === 'etc' && v.colorEtc).map(v => v.colorEtc));

  // 사이즈
  const sizeRows = SIZES.map(s => ({ html: s, n: list.filter(v => v.size === s).length }));
  document.getElementById('sizeBars').innerHTML = bars(sizeRows, total);

  // 색 × 사이즈 (주문 수량 확인용)
  const head = `<tr><th class="l">색 / 사이즈</th>${SIZES.map(s => `<th>${s.replace(/\(.*\)/, '')}</th>`).join('')}<th>합계</th></tr>`;
  const body = COLORS.map(c => {
    const row = SIZES.map(s => list.filter(v => v.color === c.key && v.size === s).length);
    const sum = row.reduce((a, b) => a + b, 0);
    return `<tr><td class="l">${esc(c.label)}</td>${row.map(n => `<td>${n || ''}</td>`).join('')}<td><b>${sum}</b></td></tr>`;
  }).join('');
  document.getElementById('crossTable').innerHTML = head + body;

  // 멤버: 투표함 초록 / 아직 빨강, 명단 밖 투표자는 뒤에 회색으로
  const votedNames = new Set(list.map(v => String(v.name).trim()));
  const doneCnt = MEMBERS.filter(n => votedNames.has(n)).length;
  const others = list.filter(v => !MEMBERS.includes(String(v.name).trim()));
  document.getElementById('memberSummary').textContent =
    `멤버 ${MEMBERS.length}명 중 ${doneCnt}명 투표 · ${MEMBERS.length - doneCnt}명 아직`;
  document.getElementById('voterChips').innerHTML =
    MEMBERS.map(n => `<span class="chip ${votedNames.has(n) ? 'done' : 'todo'}">${esc(n)}</span>`).join('') +
    (others.length ? `<div class="muted" style="width:100%;margin-top:8px">멤버 명단 밖 투표자</div>` +
      others.map(v => `<span class="chip">${esc(v.name)}</span>`).join('') : '');

  if (isTeacher) {
    document.getElementById('teacherCard').classList.remove('hidden');
    document.getElementById('detailTable').innerHTML =
      `<tr><th>학번</th><th class="l">이름</th><th>시안</th><th class="l">색</th><th>사이즈</th><th>제출</th></tr>` +
      list.map(v => `<tr>
        <td>${esc(v.id)}</td><td class="l">${esc(v.name)}</td>
        <td class="wrap">${(v.designs || []).join(', ')}${v.designEtc ? ` <span class="muted">+제안: ${esc(v.designEtc)}</span>` : ''}</td>
        <td class="l">${esc(colorLabel(v.color))}${v.colorEtc ? ` (${esc(v.colorEtc)})` : ''}</td>
        <td>${esc(v.size)}</td>
        <td class="muted">${v.at ? new Date(v.at).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : ''}</td>
      </tr>`).join('');
  }
}

// 엑셀: 전체 응답 / 시안·색 집계 / 색×사이즈 주문표 / 멤버 투표 여부
function downloadXlsx() {
  if (typeof XLSX === 'undefined') { alert('엑셀 도구를 불러오지 못했어요. 새로고침 후 다시 시도해주세요.'); return; }
  const list = lastList;
  const total = list.length;
  const fmt = t => t ? new Date(t).toLocaleString('ko-KR') : '';
  const wb = XLSX.utils.book_new();
  const add = (rows, name, widths) => {
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!cols'] = widths.map(w => ({ wch: w }));
    XLSX.utils.book_append_sheet(wb, ws, name);
  };

  add([
    ['학번', '이름', ...DESIGNS.map(d => `시안${d.key}`), '그외 시안 제안', '색', '그외 색 제안', '사이즈', '제출 시각'],
    ...list.map(v => [
      v.id, v.name,
      ...DESIGNS.map(d => (v.designs || []).includes(d.key) ? 'O' : ''),
      v.designEtc || '', colorLabel(v.color), v.colorEtc || '', v.size || '', fmt(v.at),
    ]),
  ], '전체 응답', [7, 9, ...DESIGNS.map(() => 7), 30, 11, 16, 10, 22]);

  const pct = n => total ? Math.round(n / total * 100) + '%' : '';
  const dEtc = list.filter(v => v.designEtc).length;
  add([
    [`참여 인원 ${total}명`],
    [],
    ['뒷면 시안', '득표', '참여 인원 대비'],
    ...DESIGNS.map(d => { const n = list.filter(v => (v.designs || []).includes(d.key)).length; return [`${d.key}. ${d.label}`, n, pct(n)]; }),
    ['8. 그외 제안', dEtc, pct(dEtc)],
    [],
    ['색', '인원', '비율'],
    ...COLORS.map((c, i) => { const n = list.filter(v => v.color === c.key).length; return [`${i + 1}. ${c.label}`, n, pct(n)]; }),
  ], '집계', [34, 8, 14]);

  const cross = COLORS.map(c => {
    const row = SIZES.map(s => list.filter(v => v.color === c.key && v.size === s).length);
    return [c.label, ...row, row.reduce((a, b) => a + b, 0)];
  });
  const colSum = SIZES.map((s, i) => cross.reduce((a, r) => a + r[i + 1], 0));
  add([
    ['색 / 사이즈', ...SIZES, '합계'],
    ...cross,
    ['합계', ...colSum, total],
  ], '색×사이즈', [14, ...SIZES.map(() => 9), 8]);

  const voted = new Map(list.map(v => [String(v.name).trim(), v]));
  add([
    ['이름', '투표 여부', '학번'],
    ...MEMBERS.map(n => [n, voted.has(n) ? '투표함' : '아직', voted.has(n) ? voted.get(n).id : '']),
    ...list.filter(v => !MEMBERS.includes(String(v.name).trim())).map(v => [v.name, '투표함(명단 밖)', v.id]),
  ], '멤버 투표 여부', [10, 14, 8]);

  const d = new Date();
  const stamp = `${d.getMonth() + 1}월${d.getDate()}일_${String(d.getHours()).padStart(2, '0')}${String(d.getMinutes()).padStart(2, '0')}`;
  XLSX.writeFile(wb, `코스모스_후드티_설문_${stamp}.xlsx`);
}

async function load() {
  try {
    const votes = await fetch(`${await hoodBase()}/votes.json`).then(r => r.json());
    render(votes);
    document.getElementById('updated').textContent = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) + ' 기준';
  } catch (e) {
    document.getElementById('updated').textContent = '불러오기 실패 — 새로고침을 눌러주세요';
  }
}

load();
setInterval(load, 20000);
</script>
</body>
</html>
