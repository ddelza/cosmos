<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우주의 크기 가늠해 보기</title>
<style>
  :root{
    --bg:#03050c; --ink:#eef2ff; --dim:#9aa6c8; --red:#ff5b4d; --blue:#7fb6ff; --gold:#ffd36a;
    --glass:rgba(14,20,40,.72); --line:rgba(150,170,230,.28);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
    font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;user-select:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  button{font:inherit;color:inherit;cursor:pointer}

  #heading{position:fixed;left:24px;top:18px;font-size:clamp(13px,1vw,18px);color:var(--dim);font-weight:600;letter-spacing:-.01em;line-height:1.45}
  #heading b{color:var(--ink);font-size:1.3em}
  /* 크기 과장 안내 (2·3단계) */
  #note{display:table;margin-top:8px;font-size:.9em;color:#c9b48a;font-weight:700;
    background:rgba(40,32,14,.55);border:1px solid rgba(230,200,130,.3);border-radius:8px;padding:4px 10px;
    opacity:0;transition:opacity .45s;pointer-events:none}
  #note.on{opacity:1}

  /* 현재 단계 카드 */
  #card{position:fixed;left:50%;top:22px;transform:translateX(-50%);text-align:center;
    background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:14px 34px 16px;
    backdrop-filter:blur(6px);transition:opacity .45s, transform .45s;min-width:min(520px,80vw)}
  #card.hide{opacity:0;transform:translate(-50%,-12px)}
  #card .no{font-size:clamp(13px,.95vw,17px);color:var(--dim);font-weight:700;letter-spacing:.08em}
  #card .tt{font-size:clamp(22px,2.2vw,40px);font-weight:800;margin-top:2px}
  #card .dd{font-size:clamp(26px,2.7vw,50px);font-weight:900;color:var(--red);margin-top:2px;line-height:1.15}
  #card .ss{font-size:clamp(15px,1.15vw,21px);color:var(--dim);margin-top:4px}

  /* 배율 카운터 */
  #counter{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;
    font-size:clamp(60px,9vw,170px);font-weight:900;color:rgba(255,125,105,.92);opacity:0;
    text-shadow:0 0 40px rgba(255,80,60,.55);transition:opacity .5s;white-space:nowrap}
  #counter.on{opacity:1}
  #counter small{display:block;text-align:center;font-size:.22em;font-weight:700;color:rgba(255,220,210,.85);margin-top:-.2em}

  /* 축척 막대 */
  #scale{position:fixed;left:26px;bottom:132px;font-size:clamp(13px,1vw,18px);color:var(--dim);font-weight:700}
  #scale .bar{height:9px;border:2px solid var(--dim);border-top:none;margin-bottom:5px}

  /* 하단 진행 표시 */
  #timeline{position:fixed;left:calc(50% - 95px);bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:5px;
    max-width:calc(100vw - 230px)}
  .chip{background:rgba(20,28,52,.7);border:1px solid var(--line);border-radius:12px;padding:7px 10px;text-align:center;
    min-width:clamp(84px,7.2vw,150px);transition:all .3s;opacity:.62}
  .chip .t{font-size:clamp(12px,.95vw,17px);font-weight:700;white-space:nowrap}
  .chip .d{font-size:clamp(12px,.95vw,17px);color:var(--red);font-weight:800;white-space:nowrap}
  .chip.cur{opacity:1;background:rgba(40,52,96,.9);border-color:#8fa8ff;box-shadow:0 0 18px rgba(120,150,255,.35);transform:translateY(-3px)}
  .chip.done{opacity:.85}
  .chip.goal{opacity:.8;border-color:rgba(143,168,255,.6);border-style:dashed}
  .arrow{font-size:clamp(11px,.85vw,16px);color:#ff8a7a;font-weight:800;white-space:nowrap;opacity:.45;transition:opacity .3s}
  .arrow.done{opacity:1}

  #ctrl{position:fixed;right:18px;bottom:18px;display:flex;gap:8px}
  #ctrl button{width:52px;height:52px;border-radius:50%;background:rgba(20,28,52,.8);border:1px solid var(--line);font-size:22px}
  #ctrl button:hover{background:rgba(50,64,110,.9)}
  #hint{position:fixed;right:22px;top:20px;font-size:clamp(12px,.9vw,16px);color:var(--dim);text-align:right;line-height:1.5}

  /* 설명 패널 */
  #panel{position:fixed;inset:0;background:rgba(2,4,10,.78);display:flex;align-items:center;justify-content:center;
    opacity:0;pointer-events:none;transition:opacity .3s;z-index:10}
  #panel.open{opacity:1;pointer-events:auto}
  .pbox{position:relative;width:min(1700px,95vw);height:min(960px,90vh);background:rgba(10,15,32,.96);
    border:1px solid var(--line);border-radius:22px;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);overflow:hidden;
    box-shadow:0 20px 80px rgba(0,0,0,.6)}
  .pimg{display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;padding:18px;min-height:0}
  .frame{position:relative;display:inline-block;cursor:zoom-in;line-height:0}
  /* 사진 칸 = 상자 너비의 1.35/2.35, 위아래 여백(18px×2)과 출처 줄을 뺀 높이 */
  .frame img{display:block;max-width:calc(min(1700px, 95vw) * 1.35 / 2.35 - 36px);max-height:calc(min(960px, 90vh) - 90px);
    border-radius:8px;opacity:0;transition:opacity .35s}
  .frame img.ok{opacity:1}
  .mark{position:absolute;transform:translate(-50%,-50%);width:54px;height:54px;border:3px solid;border-radius:50%;pointer-events:none}
  .mark span{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:6px;white-space:nowrap;line-height:1.2;
    font-size:clamp(14px,1.1vw,20px);font-weight:800;background:rgba(0,0,0,.65);padding:3px 8px;border-radius:6px}
  .credit{margin-top:10px;font-size:12px;color:#7d88a8;text-align:center;line-height:1.3}
  .ptext{padding:clamp(22px,2.6vw,48px);display:flex;flex-direction:column;min-height:0}
  .ptag{align-self:flex-start;font-size:clamp(13px,1vw,18px);font-weight:800;padding:4px 12px;border-radius:999px;background:#2b3a6e;color:#cfe0ff}
  .ptext h2{font-size:clamp(28px,2.6vw,50px);margin:12px 0 4px;letter-spacing:-.02em;line-height:1.15}
  .ptext .cap{color:var(--dim);font-size:clamp(14px,1.05vw,19px);margin-bottom:12px}
  .pbody{flex:1;overflow:auto;font-size:clamp(18px,1.5vw,28px);line-height:1.55}
  .pbody ul{margin:0;padding-left:1.1em}
  .pbody li{margin:.35em 0}
  .pbody b{color:var(--gold)}
  .pbody b.r{color:#ff7a66}
  .pbody b.b{color:#8cc0ff}
  .pbody .ex{margin-top:.7em;padding:.5em .8em;border-left:4px solid #5a74c8;background:rgba(60,80,150,.18);border-radius:0 10px 10px 0}
  .pbody table{border-collapse:collapse;width:100%;margin-top:.7em;font-size:.82em}
  .pbody th,.pbody td{border:1px solid rgba(150,170,230,.3);padding:.3em .5em;text-align:center}
  .pbody th{background:rgba(70,90,160,.35)}
  .cbar{height:22px;border-radius:11px;margin:.6em 0 .2em;background:linear-gradient(90deg,#7fa8ff,#dfe8ff,#fff6cf,#ffc06a,#ff6a4a)}
  .clab{display:flex;justify-content:space-between;gap:.8em;font-size:.72em;color:var(--dim);font-weight:700}
  .pnav{display:flex;align-items:center;justify-content:space-between;margin-top:14px;gap:10px}
  .pnav button{background:#22305c;border:1px solid var(--line);border-radius:12px;padding:10px 20px;font-size:clamp(15px,1.1vw,20px);font-weight:700}
  .pnav button:disabled{opacity:.3;cursor:default}
  .dots{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .dots i{width:12px;height:12px;border-radius:50%;background:#34416e;cursor:pointer}
  .dots i.on{background:#9db6ff}
  .close{position:absolute;right:14px;top:10px;width:46px;height:46px;border-radius:50%;background:rgba(40,50,90,.8);border:1px solid var(--line);font-size:26px;line-height:1;z-index:2}
  #panel.zoom .pbox{grid-template-columns:1fr}
  #panel.zoom .ptext{display:none}
  #panel.zoom .frame{cursor:zoom-out}
  #panel.zoom .frame img{max-width:calc(min(1700px, 95vw) - 36px)}
  /* 교실 프로젝터(1024~1280 폭): 진행 표시를 왼쪽에 붙이고 줄여서 오른쪽 버튼과 안 겹치게 */
  @media (min-width:901px) and (max-width:1300px){
    #timeline{left:12px;transform:none;gap:2px;max-width:calc(100vw - 214px)}
    .chip{min-width:min-content;padding:5px 5px;flex:0 1 auto}
    .chip .t,.chip .d{white-space:normal;word-break:keep-all;line-height:1.2}
    .chip .t,.chip .d{font-size:12px}
    .arrow{font-size:11px;white-space:normal;word-break:keep-all;text-align:center;line-height:1.15;flex:0 1 auto}
  }
  @media (max-width:900px){
    .pbox{grid-template-columns:1fr;grid-template-rows:auto 1fr}
    .frame img{max-width:88vw;max-height:38vh}
    #panel.zoom .frame img{max-width:88vw;max-height:calc(90vh - 90px)}
    #note{display:none}
    #timeline{max-width:96vw;overflow:auto;bottom:84px}
    .chip{min-width:84px;padding:6px 8px}
    #scale{bottom:170px}
    #hint{display:none}
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="heading"><b>우주의 크기 가늠해 보기</b><br>한 칸 갈 때마다 몇 배씩 멀어질까?
  <div id="note">※ 천체 크기는 보기 쉽게 키움<br>(거리 비율은 실제)</div></div>
<div id="hint">→ / 스페이스 : 다음 &nbsp; ← : 이전<br>천체를 클릭하면 설명이 나와요</div>
<div id="card"><div class="no"></div><div class="tt"></div><div class="dd"></div><div class="ss"></div></div>
<div id="counter"></div>
<div id="scale"><div class="bar"></div><div class="lab"></div></div>
<div id="timeline"></div>
<div id="ctrl">
  <button id="bPrev" title="이전 (←)">◀</button>
  <button id="bNext" title="다음 (→)">▶</button>
  <button id="bFull" title="전체 화면 (F)">⛶</button>
</div>

<div id="panel">
  <div class="pbox">
    <button class="close" title="닫기 (Esc)">×</button>
    <div class="pimg"><div class="frame"><img alt=""></div><div class="credit"></div></div>
    <div class="ptext">
      <div class="ptag"></div>
      <h2></h2>
      <div class="cap"></div>
      <div class="pbody"></div>
      <div class="pnav"><button class="pp">◀ 이전</button><div class="dots"></div><button class="pn">다음 ▶</button></div>
    </div>
  </div>
</div>

<script>
// ───────── 단위·위치 (모든 좌표는 km) ─────────
const LY = 9.4607e12, AU = 1.496e8, D2R = Math.PI / 180;
const polar = (o, d, deg) => ({ x: o.x + d * Math.cos(deg * D2R), y: o.y + d * Math.sin(deg * D2R) });
const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };

const EARTH = { x: 0, y: 0 };
const MOON  = { x: 384400, y: 0 };
const SUN   = { x: -AU, y: 0 };
const PROX  = polar(SUN, 4.24 * LY, -14);     // 프록시마 센타우리
const ACEN  = polar(SUN, 4.37 * LY, -11.2);   // 알파 센타우리 A·B (프록시마와 약 0.2광년)
const SUN_R_GAL = 27700;                       // 은하 중심 ~ 태양 (광년)
const GC    = polar(SUN, SUN_R_GAL * LY, 195); // 우리은하 중심
const M31   = polar(GC, 2.5e6 * LY, -12);      // 안드로메다은하 중심
const LG    = mid(GC, M31);                    // 국부 은하군 (대략의 중심)
const VIRGO = polar(GC, 5.4e7 * LY, 16);       // 처녀자리 은하단 중심 (16.5 Mpc)
const U_R   = 4.65e10;                         // 관측 가능한 우주 반지름 (광년)

const STAGES = [
  { a: EARTH, b: MOON, title: '지구 ↔ 달', dist: '약 38만 km', sub: '빛으로 약 1.3초', chip: '38만 km', line: '38만 km' },
  { a: EARTH, b: SUN, title: '지구 ↔ 태양', dist: '1 AU (약 1억 5천만 km)', sub: '빛으로 약 8분 20초', chip: '1 AU', line: '1 AU', ratio: '×390', rv: 390, note: true },
  { a: SUN, b: PROX, title: '태양 ↔ 가장 가까운 별', dist: '약 4.2 광년', sub: '프록시마 센타우리 · 빛으로 약 4년 3개월', chip: '4.2 광년', line: '4.2 광년', ratio: '×27만', rv: 27e4, note: true },
  { a: { x: GC.x - 5e4 * LY, y: GC.y }, b: { x: GC.x + 5e4 * LY, y: GC.y }, title: '우리은하 지름', dist: '약 3만 pc (약 10만 광년)', sub: '빛으로 약 10만 년', chip: '약 10만 광년', line: '지름 약 10만 광년', ratio: '×2만 4천', rv: 24000, fit: [0.5, 0.68], diam: true, room: [2.4, 0.6] },
  { a: GC, b: M31, title: '우리은하 ↔ 안드로메다은하', dist: '약 250만 광년', sub: '가장 가까운 큰 은하 · 빛으로 약 250만 년', chip: '250만 광년', line: '약 250만 광년', ratio: '×25', rv: 25 },
  { a: GC, b: VIRGO, title: '우리은하 ↔ 처녀자리 은하단', dist: '약 5,400만 광년', sub: '가장 가까운 큰 은하단 · 은하 약 1,300~2,000개', chip: '5,400만 광년', line: '약 5,400만 광년', ratio: '×22', rv: 22 },
  { a: { x: GC.x - U_R * LY, y: GC.y }, b: { x: GC.x + U_R * LY, y: GC.y }, title: '관측 가능한 우주', dist: '지름 약 930억 광년', sub: '은하 수천억 개 이상 · 우주의 나이 약 138억 년', chip: '지름 930억 광년', line: '지름 약 930억 광년', ratio: '×1,700', rv: 1700, fit: [0.5, 0.68], diam: true, room: [0.6, 2.4] },
];
// rv: ratio 라벨의 숫자 (인접 단계 이동 때 카운터가 라벨을 넘지 않게)
// room: 지름 단계에서 그림 위·아래에 비워 둘 이름표 자리 (글자 크기 배수)
const LD = STAGES.map(s => Math.log(dist(s.a, s.b))); // 단계별 실제 거리 (ln km)
let LOGS = [];                                        // 단계별 카메라 배율 (ln S)
const CHIP_TITLES = ['지구 ↔ 달', '지구 ↔ 태양', '가장 가까운 별', '우리은하 지름', '안드로메다은하', '처녀자리 은하단', '관측 가능한 우주'];

// ───────── 캔버스 ─────────
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.imageSmoothingQuality = 'high';
  updateLogs();
  if (!anim) cam = stageCam(cur); // 이동 중이면 stepAnim이 새 화면 기준 목표를 다시 계산
}
// 상단 카드 아래 ~ 하단 진행 표시 위: 지름 단계 그림이 들어갈 칸 (resize·goTo 때만 재서 BAND에 둠)
let BAND = [0, 0];
function safeBand() {
  const c = document.getElementById('card'), tl = document.getElementById('timeline');
  const top = c.offsetTop + c.offsetHeight + 8, bot = tl.getBoundingClientRect().top - 8;
  return bot - top > H * 0.4 ? [top, bot] : [0, H];
}
function stageCam(i) {
  const s = STAGES[i], c = mid(s.a, s.b);
  const [fw, fh] = s.fit || [0.58, 1.1];
  if (!s.diam) return { x: c.x, y: c.y, S: dist(s.a, s.b) / Math.min(fw * W, fh * H) };
  // 지름 단계: 카드·이름표에 가리지 않게 남는 칸 안에 맞추고 중심을 그만큼 내림
  const [top, bot] = BAND, t = top + s.room[0] * fs(), b = bot - s.room[1] * fs();
  const S = dist(s.a, s.b) / Math.min(fw * W, fh * H, b - t);
  return { x: c.x, y: c.y - ((t + b) / 2 - H / 2) * S, S };
}
function updateLogs() {
  // 카드 높이는 도착할 단계(cur) 내용으로 잰 뒤 되돌림 (화면에 그려지기 전이라 깜빡이지 않음)
  const c = document.getElementById('card'), keep = c.innerHTML;
  fillCard(cur); BAND = safeBand(); c.innerHTML = keep;
  LOGS = STAGES.map((_, i) => Math.log(stageCam(i).S));
}
// 지금 카메라 배율(S)이 보여 주는 '실제 길이': 단계별 (ln S, ln 거리)를 꺾은선으로 이음
function realLen(S) {
  const L = Math.log(S), n = LOGS.length;
  let k = 0; while (k < n - 2 && L > LOGS[k + 1]) k++;
  const f = (L - LOGS[k]) / (LOGS[k + 1] - LOGS[k]); // 양 끝 밖은 끝 구간 기울기로 연장
  return Math.exp(LD[k] + (LD[k + 1] - LD[k]) * f);
}
const toScreen = p => ({ x: W / 2 + (p.x - cam.x) / cam.S, y: H / 2 + (p.y - cam.y) / cam.S });

// ───────── 이미지 ─────────
const IMG = {};
function img(name) {
  if (!IMG[name]) { const im = new Image(); im.src = 'img/' + name + '.jpg'; IMG[name] = im; }
  return IMG[name];
}
// 사진 속 원반 위치 (가로·세로 비율, 반지름은 가로 기준)
const DISK = { earth: { cx: .4984, cy: .494, r: .4445 }, moon: { cx: .501, cy: .510, r: .4155 } };
img('earth'); img('moon');

// ───────── 난수 ─────────
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const gauss = r => { let u = 0; while (!u) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * r()); };

// ───────── 은하 만들기 (좌표 단위: 광년) ─────────
function galaxyBuilder() {
  const groups = {}, haze = [];
  return {
    // haze: 흐린 빛 번짐층에도 넣을 입자 (나선팔·중심부)
    add(color, x, y, s, h = false) { (groups[color] = groups[color] || []).push(x, y, s); if (h) haze.push(color, x, y); },
    done() { return { groups: Object.entries(groups).map(([color, arr]) => ({ color, d: new Float32Array(arr) })), haze }; }
  };
}
// 은하 한 개를 고해상도 그림으로 미리 그려 두고, 매 프레임엔 크기만 바꿔 붙임
function renderGalaxyTexture(g, size = 1800) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const x = c.getContext('2d'), half = g.R * 1.08, k = size / 2 / half, o = size / 2;
  x.globalCompositeOperation = 'lighter';
  x.save(); x.translate(o, o); x.rotate(g.pa); x.scale(1, g.tilt);

  { id: 'acen', name: '알파 센타우리 A·B', pos: ACEN, r: 850000, min: 8, parent: SUN, fade: [12, 36], color: '#ffe9a6', panel: ['star', 0], lab: 'below', star: true, small: true },
  { id: 'sun', name: '태양', pos: SUN, r: 696000, min: 18, parent: GC, fade: [16, 50], color: '#ffc53d', panel: ['star', 0], lab: 'below', star: true },
];
function bodyState(b) {
  const p = toScreen(b.pos), sep = dist(b.pos, b.parent) / cam.S;
  let alpha = smooth(b.fade[0], b.fade[1], sep);
  let min = b.min;
  if (b.id === 'sun') { const g = smooth(12, 14.2, Math.log10(cam.S)); min = b.min * (1 - g) + 4 * g; }
  const rpx = Math.max(b.r / cam.S, min);
  return { p, alpha, rpx };
}

function drawStarGlow(x, y, rpx, color, alpha) {
  const R = rpx * 2.8;
  const gr = ctx.createRadialGradient(x, y, 0, x, y, R);
  gr.addColorStop(0, `rgba(255,255,255,${alpha})`);
  gr.addColorStop(0.3, hexA(color, alpha));
  gr.addColorStop(0.42, hexA(color, alpha * 0.45));
  gr.addColorStop(1, hexA(color, 0));
  ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(x, y, R, 0, 7); ctx.fill();
}
function hexA(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
}
function drawSprite(b, x, y, rpx, alpha) {
  const im = IMG[b.sprite], d = DISK[b.sprite];
  ctx.globalAlpha = alpha;
  if (b.id === 'earth') { // 대기 빛
    const gr = ctx.createRadialGradient(x, y, rpx * 0.9, x, y, rpx * 1.5);
    gr.addColorStop(0, 'rgba(120,180,255,.45)'); gr.addColorStop(1, 'rgba(120,180,255,0)');
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(x, y, rpx * 1.5, 0, 7); ctx.fill();
  }
  if (im && im.complete && im.naturalWidth && rpx > 2.5) {
    const w = im.naturalWidth, h = im.naturalHeight, rr = d.r * w;
    ctx.save(); ctx.beginPath(); ctx.arc(x, y, rpx, 0, 7); ctx.clip();
    ctx.drawImage(im, d.cx * w - rr, d.cy * h - rr, rr * 2, rr * 2, x - rpx, y - rpx, rpx * 2, rpx * 2);
    ctx.restore();
  } else {
    ctx.fillStyle = b.color; ctx.beginPath(); ctx.arc(x, y, rpx, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function label(text, x, y, alpha, color = '#e8eeff', size = 20, weight = 700) {
  if (alpha < 0.02) return;
  ctx.globalAlpha = alpha;
  ctx.font = `${weight} ${size}px "Pretendard","Malgun Gothic",sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,.75)'; ctx.strokeText(text, x, y);
  ctx.fillStyle = color; ctx.fillText(text, x, y);
  ctx.globalAlpha = 1;
}
const fs = () => clamp(W / 85, 15, 26);

// ───────── 그리기 ─────────
function galaxyAlpha(g) { const diam = 2 * g.R * LY / cam.S; return smooth(40000, 4000, diam); }

function drawGalaxy(g, alpha) {
  if (alpha < 0.01 || !g.tex) return; // 아직 그림을 만드는 중이면 건너뜀
  const k = LY / cam.S, c = toScreen(g.pos), h = g.half * k;
  if (c.x + h < 0 || c.x - h > W || c.y + h < 0 || c.y - h > H) return;
  // 몇 픽셀보다 작아지면 점으로 (사이 구간은 서서히 바꿈)
  const ta = g.dot ? smooth(2.5, 6, h) : 1;
  if (ta < 1) {
    ctx.globalAlpha = alpha * (1 - ta); ctx.fillStyle = '#fff1d6';
    ctx.beginPath(); ctx.arc(c.x, c.y, 2, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
    if (ta < 0.01) return;
  }
  // 화면 크기에 맞는 가장 작은 미리 줄인 그림을 골라 반짝임 방지
  let tex = g.tex;
  for (const m of g.mips || []) if (m.width >= h * 2 * DPR) tex = m;
  ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = alpha * ta;
  ctx.drawImage(tex, c.x - h, c.y - h, h * 2, h * 2);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}

function drawField(alpha) {
  if (alpha < 0.01) return;
  const k = LY / cam.S, o = toScreen(GC), v = toScreen(VIRGO), vr = 4e6 * k;
  ctx.globalCompositeOperation = 'lighter';
  if (vr > 2 && vr < 4000) { // 은하단을 감싸는 희미한 빛
    const gr = ctx.createRadialGradient(v.x, v.y, 0, v.x, v.y, vr);
    gr.addColorStop(0, `rgba(255,225,190,${0.22 * alpha})`); gr.addColorStop(1, 'rgba(255,225,190,0)');
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(v.x, v.y, vr, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = alpha * 0.85;
  for (let c = 0; c < FCOL.length; c++) {
    ctx.fillStyle = FCOL[c];
    for (let i = 0; i < FIELD.length; i += 4) {
      if (FIELD[i + 3] !== c) continue;
      const x = o.x + FIELD[i] * k, y = o.y + FIELD[i + 1] * k;
      if (x < -4 || x > W + 4 || y < -4 || y > H + 4) continue;
      const s = FIELD[i + 2] * 1.3;
      ctx.fillRect(x - s / 2, y - s / 2, s, s);
    }
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}

function drawBackground(now) {
  const L = Math.log10(cam.S);
  const dim = 1 - 0.5 * smooth(15.4, 16.2, L) - 0.3 * smooth(19.5, 21, L);
  ctx.fillStyle = '#03050c'; ctx.fillRect(0, 0, W, H);
  for (const s of STATIC_STARS) {
    ctx.globalAlpha = s.a * dim * (0.8 + 0.2 * Math.sin(now / 900 + s.tw));
    ctx.fillStyle = '#fff'; ctx.fillRect(s.x * W, s.y * H, s.s, s.s);
  }
  // 줌아웃할 때 안쪽으로 빨려 들어가는 별 (log 배율에 따라 움직임)
  const Rmax = Math.hypot(W, H) / 2, D = 1.3;
  for (const s of FLOW_STARS) {
    let z = (s.p + L / D) % 1; if (z < 0) z += 1;
    const r = Rmax * Math.pow(10, -z * D);
    const a = s.a * dim * smooth(0, 0.08, z) * (1 - smooth(0.5, 0.95, z));
    if (a < 0.02) continue;
    const sz = 0.6 + 1.3 * (1 - z);
    ctx.globalAlpha = a; ctx.fillStyle = s.c;
    ctx.fillRect(W / 2 + r * Math.cos(s.ang) - sz / 2, H / 2 + r * Math.sin(s.ang) - sz / 2, sz, sz);
  }
  ctx.globalAlpha = 1;
}

function drawDistanceLines() {
  const L = Math.log10(cam.S);
  STAGES.forEach((s, i) => {
    const a = 1 - smooth(0.05, 0.4, Math.abs(L - LOGS[i] / Math.LN10));
    if (a < 0.02) return;
    const p = toScreen(s.a), q = toScreen(s.b);
    ctx.globalAlpha = a * 0.9;
    ctx.strokeStyle = '#ff7a66'; ctx.lineWidth = 2.5; ctx.setLineDash([9, 7]);
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke(); ctx.setLineDash([]);
    if (s.diam) { // 지름: 양 끝 화살촉
      const ang = Math.atan2(q.y - p.y, q.x - p.x);
      [[p, ang + Math.PI], [q, ang]].forEach(([o, an]) => {
        ctx.beginPath(); ctx.moveTo(o.x, o.y);
        ctx.lineTo(o.x - 14 * Math.cos(an - .45), o.y - 14 * Math.sin(an - .45));
        ctx.moveTo(o.x, o.y); ctx.lineTo(o.x - 14 * Math.cos(an + .45), o.y - 14 * Math.sin(an + .45)); ctx.stroke();
      });
    }
    const m = mid(p, q), ang = Math.atan2(q.y - p.y, q.x - p.x);
    label(s.line, m.x, m.y - 30, a, '#ffb3a6', fs() * 1.15, 800); // 선 위쪽에 표시
  });
}

function drawBodies(now) {
  const states = [];
  for (const b of BODIES) {
    const st = bodyState(b); states.push([b, st]);
    if (st.alpha < 0.01) continue;
    const { p, rpx, alpha } = st;
    if (p.x < -200 || p.x > W + 200 || p.y < -200 || p.y > H + 200) continue;
    if (b.sprite) drawSprite(b, p.x, p.y, rpx, alpha);
    else drawStarGlow(p.x, p.y, rpx, b.color, alpha);
    // 은하 규모에서는 태양 = '태양계' 빨간 표시
    if (b.id === 'sun') {
      const g = smooth(12.5, 14, Math.log10(cam.S));
      if (g > 0.01) {
        const pr = 9 + 4 * Math.sin(now / 300);
        ctx.globalAlpha = g * alpha; ctx.strokeStyle = '#ff4a3a'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(p.x, p.y, pr, 0, 7); ctx.stroke();
        ctx.fillStyle = '#ff4a3a'; ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, 7); ctx.fill();
        ctx.globalAlpha = 1;
      }
    }
  }
  // 이름표
  for (const [b, st] of states) {
    if (st.alpha < 0.02) continue;
    const { p, rpx, alpha } = st;
    const dy = (b.star ? rpx * 1.6 : rpx) + fs() * 0.95, y = b.lab === 'above' ? p.y - dy : p.y + dy;
    if (b.id === 'sun') { // 은하 규모로 갈수록 '태양' → '태양계' 이름표로 서서히 바뀜
      const g = smooth(12.95, 13.45, Math.log10(cam.S));
      label(b.name, p.x, y, alpha * (1 - g), '#e8eeff', fs());
      label('태양계 (우리가 있는 곳)', p.x, y, alpha * g, '#ff8a7a', fs());
      continue;
    }
    label(b.name, p.x, y, alpha * (b.small ? 0.8 : 1), '#e8eeff', b.small ? fs() * 0.8 : fs());
  }
}

function drawGalaxyLabels() {
  const mwA = galaxyAlpha(GALAXIES.mw), m31A = galaxyAlpha(GALAXIES.m31);
  const k = LY / cam.S;
  const mw = toScreen(GC), fa = fieldAlpha(), ua = galaxyAlpha(UNIVERSE);
  const lgT = smooth(60, 140, dist(GC, M31) / cam.S); // 두 은하가 가까워 보이면 이름 대신 '국부 은하군'
  if (mwA * lgT > 0.02) label('우리은하', mw.x, mw.y - GALAXIES.mw.R * k - fs() * 1.0, mwA * lgT, '#cfe0ff', fs() * 1.1, 800);
  const a = toScreen(M31);
  if (m31A * lgT > 0.02) label('안드로메다은하', a.x, a.y + GALAXIES.m31.R * k * 0.62 + fs() * 1.3, m31A * lgT, '#cfe0ff', fs() * 1.1, 800);
  // 국부 은하군 (지름 약 1000만 광년)
  const lgA = (1 - lgT) * fa, lg = toScreen(LG), lr = 5e6 * k;
  if (lgA > 0.02) {
    if (lr > 8) {
      ctx.globalAlpha = lgA * 0.6; ctx.strokeStyle = '#9fb8ff'; ctx.lineWidth = 1.5; ctx.setLineDash([4, 5]);
      ctx.beginPath(); ctx.arc(lg.x, lg.y, lr, 0, 7); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
    }
    label('국부 은하군 (우리은하가 속한 무리)', lg.x, lg.y + Math.max(lr, 10) + fs(), lgA, '#cfe0ff', fs() * 0.95, 800);
  }
  const v = toScreen(VIRGO);
  if (fa > 0.02) label('처녀자리 은하단', v.x, v.y + Math.max(4e6 * k * 0.8, 12) + fs(), fa, '#ffe2b8', fs() * 1.05, 800);
  // 관측 가능한 우주: 가운데가 우리
  if (ua > 0.02) {
    const pr = 9 + 3 * Math.sin(performance.now() / 300), ur = U_R * k;
    ctx.globalAlpha = ua; ctx.strokeStyle = '#ff4a3a'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(mw.x, mw.y, pr, 0, 7); ctx.stroke(); ctx.globalAlpha = 1;
    label('우리은하 (여기)', mw.x, mw.y + 30, ua, '#ff8a7a', fs(), 800);
    label('관측할 수 있는 끝 — 가장 오래된 빛', mw.x, mw.y + ur + fs() * 1.1, ua, '#ffb08a', fs() * 0.95, 700);
  }
}

function drawScale() {
  // 150px 근처의 깔끔한 길이 고르기
  const km = cam.S * 150;
  let unit, uKm;
  if (km < 0.05 * AU) { unit = 'km'; uKm = 1; } else if (km < 0.05 * LY) { unit = 'AU'; uKm = AU; } else { unit = '광년'; uKm = LY; }
  const v = km / uKm, p = Math.pow(10, Math.floor(Math.log10(v))), f = v / p;
  const nice = (f >= 5 ? 5 : f >= 2 ? 2 : 1) * p;
  const px = (nice * uKm / cam.S).toFixed(1) + 'px';
  const lab = (nice >= 1 ? fmtKo(nice) : String(+nice.toPrecision(2))) + ' ' + unit;
  if (px !== scaleLast.px) scaleBar.style.width = scaleLast.px = px; // 바뀔 때만 DOM 갱신
  if (lab !== scaleLast.lab) scaleLab.textContent = scaleLast.lab = lab;
}
const scaleBar = document.querySelector('#scale .bar'), scaleLab = document.querySelector('#scale .lab'), scaleLast = {};

function frame(now) {
  stepAnim(now);
  drawBackground(now);
  drawGalaxy(UNIVERSE, galaxyAlpha(UNIVERSE));
  drawGalaxy(GALAXIES.mw, galaxyAlpha(GALAXIES.mw));
  drawGalaxy(GALAXIES.m31, galaxyAlpha(GALAXIES.m31));
  drawField(fieldAlpha());
  drawDistanceLines();
  drawBodies(now);
  drawGalaxyLabels();
  drawScale();
  requestAnimationFrame(frame);
}

// ───────── 클릭 판정 ─────────
function hitTest(mx, my) {
  const hits = [];
  for (const b of BODIES) {
    const { p, rpx, alpha } = bodyState(b);
    if (alpha < 0.35) continue;
    const R = Math.max(rpx * (b.star ? 1.4 : 1) + 10, 26);
    if (Math.hypot(mx - p.x, my - p.y) <= R) hits.push([R, b.panel]);
  }
  const k = LY / cam.S;
  [['mw', ['galaxy', 0], 0.95], ['m31', ['galaxy', 2], 0.6]].forEach(([id, panel, f]) => {
    const g = GALAXIES[id]; if (galaxyAlpha(g) < 0.3) return;
    const c = toScreen(g.pos), R = Math.max(g.R * k * f, 34);
    if (Math.hypot(mx - c.x, my - c.y) <= R) hits.push([R, panel]);
  });
  const near = (p, R, panel) => { const c = toScreen(p); if (Math.hypot(mx - c.x, my - c.y) <= R) hits.push([R, panel]); };
  if (fieldAlpha() > 0.3) {
    near(VIRGO, Math.max(4e6 * k, 30), ['cluster', 0]);
    if (dist(GC, M31) / cam.S < 140) near(LG, Math.max(5e6 * k, 30), ['cluster', 0]);
  }
  if (galaxyAlpha(UNIVERSE) > 0.3) near(GC, U_R * k, ['universe', 0]);
  hits.sort((a, b) => a[0] - b[0]);
  return hits.length ? hits[0][1] : null;
}
cv.addEventListener('mousemove', e => { cv.style.cursor = hitTest(e.clientX, e.clientY) ? 'pointer' : 'default'; });
cv.addEventListener('click', e => { const h = hitTest(e.clientX, e.clientY); if (h) openPanel(h[0], h[1]); });

// ───────── 패널 ─────────
const panel = document.getElementById('panel');
let pGroup = null, pIdx = 0;
function openPanel(group, idx) { pGroup = group; pIdx = idx; renderPanel(); panel.classList.add('open'); }
function closePanel() { panel.classList.remove('open', 'zoom'); pGroup = null; }
function renderPanel() {
  const list = PANELS[pGroup], d = list[pIdx];
  panel.querySelector('.ptag').textContent = d.tag;
  panel.querySelector('h2').textContent = d.title;
  panel.querySelector('.cap').textContent = d.cap;
  panel.querySelector('.pbody').innerHTML = d.body;
  panel.querySelector('.credit').textContent = '사진: ' + d.credit;
  const im = panel.querySelector('.frame img'), fr = panel.querySelector('.frame');
  fr.querySelectorAll('.mark').forEach(m => m.remove());
  // 표시는 새 사진이 다 뜬 뒤에 붙임 (이전 사진 크기 위에 잠깐 엉뚱하게 뜨지 않게)
  const addMarks = () => {
    if (d !== PANELS[pGroup]?.[pIdx]) return; // 그사이 다른 쪽으로 넘어감
    fr.querySelectorAll('.mark').forEach(m => m.remove()); // 두 번 불려도 겹치지 않게
    (d.marks || []).forEach(m => {
      const el = document.createElement('div'); el.className = 'mark';
      el.style.left = m.x + '%'; el.style.top = m.y + '%'; el.style.borderColor = m.c;
      el.innerHTML = `<span style="color:${m.c}">${m.t}</span>`;
      fr.appendChild(el);
    });
  };
  if (!im.src.endsWith('img/' + d.img + '.jpg')) { im.classList.remove('ok'); im.onload = () => { im.classList.add('ok'); addMarks(); }; im.src = 'img/' + d.img + '.jpg'; }
  else if (im.complete) addMarks(); // 아직 받는 중이면 위 onload가 붙임
  const dots = panel.querySelector('.dots'); dots.innerHTML = '';
  list.forEach((_, i) => { const e = document.createElement('i'); if (i === pIdx) e.className = 'on'; e.onclick = () => { pIdx = i; renderPanel(); }; dots.appendChild(e); });
  panel.querySelector('.pp').disabled = pIdx === 0;
  panel.querySelector('.pn').textContent = pIdx === list.length - 1 ? '닫기 ✓' : '다음 ▶';
  const nx = list[pIdx + 1]; if (nx) img(nx.img); // 다음 사진 미리 불러오기
}
function panelNext() { if (pIdx < PANELS[pGroup].length - 1) { pIdx++; renderPanel(); } else closePanel(); }
function panelPrev() { if (pIdx > 0) { pIdx--; renderPanel(); } }
panel.querySelector('.pn').onclick = panelNext;
panel.querySelector('.pp').onclick = panelPrev;
panel.querySelector('.close').onclick = closePanel;
panel.querySelector('.frame').onclick = () => panel.classList.toggle('zoom');
panel.addEventListener('click', e => { if (e.target === panel) closePanel(); });

// ───────── 조작 ─────────
function toggleFull() { if (!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); }
document.getElementById('bNext').onclick = () => goTo(cur + 1);
document.getElementById('bPrev').onclick = () => goTo(cur - 1);
document.getElementById('bFull').onclick = toggleFull;
document.querySelectorAll('button').forEach(b => b.addEventListener('mouseup', () => b.blur()));

addEventListener('keydown', e => {
  const k = e.key;
  const NEXT = ['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter'], PREV = ['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'];
  if (k === 'f' || k === 'F') { if (!e.repeat) toggleFull(); return; } // 패널이 열려 있어도 전체 화면
  if (e.repeat) { if (NEXT.includes(k) || PREV.includes(k)) e.preventDefault(); return; } // 리모컨 누르고 있을 때 자동 반복 무시
  if (pGroup) {
    if (NEXT.includes(k)) { e.preventDefault(); panelNext(); }
    else if (PREV.includes(k)) { e.preventDefault(); panelPrev(); }
    else if (k === 'Escape') closePanel();
    return;
  }
  if (NEXT.includes(k)) { e.preventDefault(); goTo(cur + 1); }
  else if (PREV.includes(k)) { e.preventDefault(); goTo(cur - 1); }
  else if (k >= '1' && k <= String(STAGES.length)) goTo(+k - 1);
});
addEventListener('resize', resize);

buildTimeline();
showCard(); updateTimeline(); // 카드 내용을 먼저 채워야 지름 단계 자리 계산이 맞음
resize();
cam = stageCam(0);
requestAnimationFrame(frame);
